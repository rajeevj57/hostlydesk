<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Guest Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        h1 { margin-top: 0; color: #38bdf8; font-size: 22px; text-align: center; }
        .subtitle { text-align: center; color: #94a3b8; margin-bottom: 20px; font-size: 14px; }
        .dept-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .dept-tab { background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .dept-tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .service-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .service-card.selected { border-color: #38bdf8; background: #1e3a8a; }
        .service-card h4 { margin: 0 0 5px 0; font-size: 15px; color: #f8fafc; }
        .service-card p { margin: 0; font-size: 12px; color: #94a3b8; }
        .custom-input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; margin-bottom: 15px; }
        .btn-submit { width: 100%; background: #d97706; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #b45309; }
        .success-msg { color: #22c55e; text-align: center; margin-top: 15px; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="roomTitle">Room Service</h1>
        <div class="subtitle">Tap services below to select, or type an unlisted request. No typing required!</div>

        <div class="dept-tabs" id="deptTabs"></div>

        <div class="services-grid" id="servicesGrid">
            <div style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 20px;">Loading services...</div>
        </div>

        <input type="text" id="customRequest" class="custom-input" placeholder="Optional: Type unlisted request here...">

        <button class="btn-submit" onclick="submitRequest()">SEND REQUEST</button>
        <div id="successMsg" class="success-msg">Request sent successfully! The team has been notified.</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomNumber = urlParams.get('room') || '305';
        document.getElementById('roomTitle').innerText = `Room ${roomNumber} - Service Portal`;

        let departments = [];
        let services = [];
        let activeDepartmentId = null;
        let selectedServices = new Set();

        async function loadData() {
            try {
                const [deptRes, servRes] = await Promise.all([
                    fetch('/api/departments'),
                    fetch('/api/department-services')
                ]);
                departments = await deptRes.json();
                services = await servRes.json();

                if (departments.length > 0) {
                    activeDepartmentId = departments[0].id;
                }
                renderTabs();
                renderServices();
            } catch (err) {
                console.error('Failed to load portal data');
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('deptTabs');
            tabsContainer.innerHTML = departments.map(d => `
                <button class="dept-tab ${d.id === activeDepartmentId ? 'active' : ''}" onclick="switchDept(${d.id})">
                    ${d.name}
                </button>
            `).join('');
        }

        function switchDept(deptId) {
            activeDepartmentId = deptId;
            renderTabs();
            renderServices();
        }

        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            const filteredServices = services.filter(s => s.department_id === activeDepartmentId);

            if (filteredServices.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 20px;">No preset services for this department. Use optional text box below.</div>';
                return;
            }

            grid.innerHTML = filteredServices.map(s => `
                <div class="service-card ${selectedServices.has(s.name) ? 'selected' : ''}" onclick="toggleService('${s.name}')">
                    <h4>${s.name}</h4>
                    ${s.price && s.price > 0 ? `<p>₹${s.price}</p>` : '<p>Complimentary</p>'}
                </div>
            `).join('');
        }

        function toggleService(name) {
            if (selectedServices.has(name)) {
                selectedServices.delete(name);
            } else {
                selectedServices.add(name);
            }
            renderServices();
        }

        async function submitRequest() {
            const customText = document.getElementById('customRequest').value.trim();
            const activeDept = departments.find(d => d.id === activeDepartmentId);
            const deptName = activeDept ? activeDept.name : 'Front Office';

            let itemsList = Array.from(selectedServices).join(', ');
            if (customText) {
                itemsList = itemsList ? `${itemsList}, ${customText}` : customText;
            }

            if (!itemsList) {
                alert('Please tap at least one service card or type a request.');
                return;
            }

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room: roomNumber,
                        department: deptName,
                        items: itemsList
                    })
                });

                if (res.ok) {
                    selectedServices.clear();
                    document.getElementById('customRequest').value = '';
                    renderServices();
                    
                    const msg = document.getElementById('successMsg');
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 4000);
                } else {
                    alert('Failed to send request. Please try again.');
                }
            } catch (e) {
                alert('Network error.');
            }
        }

        loadData();
    </script>
</body>
</html>
