<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostlyDesk Guest Concierge</title>
  <style>
    :root {
      --bg-warm: #f7f5ee;
      --card-white: #ffffff;
      --navy-primary: #0d1b3e;
      --text-dark: #2c2c2c;
      --accent-gold: #c2a649;
      --border-soft: #e5e0d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-warm); color: var(--text-dark); padding-bottom: 40px; }
    .header-bar { background-color: var(--navy-primary); color: #ffffff; padding: 24px 20px; border-bottom: 4px dashed var(--accent-gold); }
    .header-content { max-width: 480px; margin: 0 auto; }
    .brand-tag { font-size: 0.75rem; letter-spacing: 2px; color: var(--accent-gold); text-transform: uppercase; font-weight: 700; }
    .room-number { font-size: 2.5rem; font-weight: 800; }
    .hotel-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
    .main-container { padding: 20px; max-width: 480px; margin: 0 auto; }
    .section-label { font-size: 1.1rem; font-weight: 700; color: var(--navy-primary); margin-top: 16px; margin-bottom: 12px; }
    .info-card { background: var(--card-white); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-soft); }
    .wifi-flex { display: flex; justify-content: space-between; font-size: 0.9rem; }
    .wifi-val { font-weight: 700; color: var(--navy-primary); }
    .media-btn-group { display: flex; gap: 12px; margin-bottom: 20px; }
    .media-btn { flex: 1; padding: 14px; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.9rem; color: #ffffff; text-align: center; }
    .btn-menu { background-color: var(--navy-primary); }
    .btn-fact { background-color: var(--accent-gold); }
    .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .service-card { background: var(--card-white); border-radius: 12px; padding: 16px 8px; text-align: center; border: 1px solid var(--border-soft); cursor: pointer; position: relative; }
    .service-card.active { border: 2px solid var(--navy-primary); background-color: #f8fafc; }
    .icon-wrapper { font-size: 2rem; margin-bottom: 6px; }
    .service-title { font-size: 0.8rem; font-weight: 600; }
    .quantity-badge { position: absolute; top: -6px; right: -6px; background: var(--navy-primary); color: #ffffff; font-size: 0.75rem; font-weight: 800; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .submit-button { width: 100%; padding: 16px; background-color: #cbd5e1; color: #ffffff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: not-allowed; }
    .submit-button.ready { background-color: var(--navy-primary); cursor: pointer; }
    .status-msg { margin-top: 16px; text-align: center; font-weight: 600; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="header-content">
      <div class="brand-tag">HostlyDesk Concierge</div>
      <div class="room-number" id="roomHeading">Room --</div>
      <div class="hotel-meta">
        <span id="hotelTitle">HostlyDesk Hotel</span>
        <span>Guest Services</span>
      </div>
    </div>
  </div>

  <div class="main-container">
    <!-- WI-FI CARD -->
    <div class="info-card" id="wifiBlock" style="display: none;">
      <div class="wifi-flex">
        <span>📶 Network: <span class="wifi-val" id="wifiSSID">--</span></span>
        <span>🔑 Pass: <span class="wifi-val" id="wifiKey">--</span></span>
      </div>
    </div>

    <!-- DOCUMENTATION BUTTONS -->
    <div class="media-btn-group" id="mediaGroup" style="display: none;">
      <a id="menuLink" href="#" target="_blank" class="media-btn btn-menu" style="display: none;">📖 Food Menu</a>
      <a id="factSheetLink" href="#" target="_blank" class="media-btn btn-fact" style="display: none;">ℹ️ Hotel Directory</a>
    </div>

    <!-- NEARBY ATTRACTIONS -->
    <div class="info-card" id="nearbyBlock" style="display: none;">
      <div class="section-label" style="margin-top:0;">📍 Local Places to Explore</div>
      <div id="nearbyBox" style="white-space: pre-line; font-size:0.9rem; color:#475569;"></div>
    </div>

    <!-- SERVICE REQUEST OPTIONS -->
    <div class="section-label">Select Room Services</div>
    <div class="service-grid">
      <div class="service-card" onclick="toggleSelection('Extra Towels', 'Housekeeping', this)">
        <div class="icon-wrapper">🚿</div><div class="service-title">Extra Towels</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Drinking Water', 'Housekeeping', this)">
        <div class="icon-wrapper">💧</div><div class="service-title">Water Bottle</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Extra Pillow', 'Housekeeping', this)">
        <div class="icon-wrapper">💤</div><div class="service-title">Extra Pillow</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Room Cleaning', 'Housekeeping', this)">
        <div class="icon-wrapper">🧹</div><div class="service-title">Clean Room</div>
      </div>
      <div class="service-card" onclick="toggleSelection('In-Room Food', 'Kitchen', this)">
        <div class="icon-wrapper">🍽️</div><div class="service-title">Order Food</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Tea / Coffee', 'Kitchen', this)">
        <div class="icon-wrapper">☕</div><div class="service-title">Tea / Coffee</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Wake-up Call', 'Front Office', this)">
        <div class="icon-wrapper">⏰</div><div class="service-title">Wake-up Call</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Taxi Assistance', 'Front Office', this)">
        <div class="icon-wrapper">🚖</div><div class="service-title">Book Taxi</div>
      </div>
      <div class="service-card" onclick="toggleSelection('Checkout Help', 'Front Office', this)">
        <div class="icon-wrapper">🧳</div><div class="service-title">Luggage Help</div>
      </div>
    </div>

    <button id="submitRequestBtn" class="submit-button" onclick="dispatchRequest()" disabled>Send Request to Staff</button>
    <div id="statusNotification" class="status-msg"></div>
  </div>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const currentHotelId = queryParams.get('hotelId') || 'hotel-kanha-shyam';
    const currentRoom = queryParams.get('room') || '101';

    document.getElementById('roomHeading').textContent = `Room ${currentRoom}`;

    async function fetchHotelConfiguration() {
      try {
        const response = await fetch(`/api/hotels/${currentHotelId}`);
        const result = await response.json();

        if (result.success && result.hotel) {
          const hotel = result.hotel;
          document.getElementById('hotelTitle').textContent = hotel.hotelName;

          if (hotel.wifiName) {
            document.getElementById('wifiSSID').textContent = hotel.wifiName;
            document.getElementById('wifiKey').textContent = hotel.wifiPassword || 'None';
            document.getElementById('wifiBlock').style.display = 'block';
          }

          let hasMedia = false;
          if (hotel.menuPdfUrl) {
            const menuBtn = document.getElementById('menuLink');
            menuBtn.href = hotel.menuPdfUrl;
            menuBtn.style.display = 'block';
            hasMedia = true;
          }

          if (hotel.factSheetUrl) {
            const factBtn = document.getElementById('factSheetLink');
            factBtn.href = hotel.factSheetUrl;
            factBtn.style.display = 'block';
            hasMedia = true;
          }

          if (hasMedia) document.getElementById('mediaGroup').style.display = 'flex';

          if (hotel.nearbyPlaces) {
            document.getElementById('nearbyBox').textContent = hotel.nearbyPlaces;
            document.getElementById('nearbyBlock').style.display = 'block';
          }
        }
      } catch (err) {}
    }

    fetchHotelConfiguration();

    const selectedServices = {};

    function toggleSelection(itemName, department, element) {
      if (!selectedServices[itemName]) {
        selectedServices[itemName] = { quantity: 1, department };
      } else {
        selectedServices[itemName].quantity += 1;
        if (selectedServices[itemName].quantity > 5) delete selectedServices[itemName];
      }

      let badge = element.querySelector('.quantity-badge');
      if (selectedServices[itemName]) {
        element.classList.add('active');
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'quantity-badge';
          element.appendChild(badge);
        }
        badge.textContent = selectedServices[itemName].quantity;
      } else {
        element.classList.remove('active');
        if (badge) badge.remove();
      }

      const submitBtn = document.getElementById('submitRequestBtn');
      if (Object.keys(selectedServices).length > 0) {
        submitBtn.classList.add('ready');
        submitBtn.disabled = false;
      } else {
        submitBtn.classList.remove('ready');
        submitBtn.disabled = true;
      }
    }

    async function dispatchRequest() {
      const statusEl = document.getElementById('statusNotification');
      const submitBtn = document.getElementById('submitRequestBtn');

      submitBtn.disabled = true;
      statusEl.style.color = '#333';
      statusEl.textContent = 'Sending request...';

      const compiledDetails = Object.keys(selectedServices)
        .map(key => `${selectedServices[key].quantity}x ${key}`)
        .join(', ');

      const initialKey = Object.keys(selectedServices)[0];
      const targetDepartment = selectedServices[initialKey].department;

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            hotelId: currentHotelId,
            roomNumber: currentRoom,
            guestName: 'Guest',
            serviceType: targetDepartment,
            details: compiledDetails
          })
        });

        const resData = await response.json();
        if (response.ok && resData.success) {
          statusEl.style.color = 'green';
          statusEl.textContent = '✓ Request sent to hotel staff!';
          setTimeout(() => location.reload(), 2500);
        } else {
          statusEl.style.color = 'red';
          statusEl.textContent = 'Submission error. Please try again.';
          submitBtn.disabled = false;
        }
      } catch (err) {
        statusEl.style.color = 'red';
        statusEl.textContent = 'Network communication error.';
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
