<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Request</title>
</head>
<body>

  <form id="requestForm">
    <label for="roomNumber">Room / Table Number</label>
    <input type="text" id="roomNumber" required>

    <label for="guestName">Guest Name</label>
    <input type="text" id="guestName" required>

    <label for="requestType">Request Type</label>
    <select id="requestType">
      <option value="Housekeeping / Amenities">Housekeeping / Amenities</option>
      <option value="Kitchen / Room Service">Kitchen / Room Service</option>
      <option value="Front Office">Front Office</option>
    </select>

    <label for="details">Details / Special Instructions</label>
    <textarea id="details"></textarea>

    <button type="submit">Submit Request</button>
  </form>

  <p id="statusMessage"></p>

  <script>
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('statusMessage');
      statusEl.textContent = 'Submitting...';

      // 1. Get hotelId from URL query (?hotelId=hotel-kanha-shyam)
      const urlParams = new URLSearchParams(window.location.search);
      const hotelId = urlParams.get('hotelId') || 'hotel-kanha-shyam';

      // 2. Build submission payload
      const requestData = {
        hotelId: hotelId,
        roomNumber: document.getElementById('roomNumber').value.trim(),
        guestName: document.getElementById('guestName').value.trim(),
        requestType: document.getElementById('requestType').value,
        details: document.getElementById('details').value.trim()
      };

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestData)
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusEl.style.color = 'green';
          statusEl.textContent = 'Request submitted successfully!';
        } else {
          statusEl.style.color = 'red';
          statusEl.textContent = 'Error: ' + (result.error || 'Failed to send request');
        }
      } catch (err) {
        statusEl.style.color = 'red';
        statusEl.textContent = 'Error submitting request.';
      }
    });
  </script>
</body>
</html>
