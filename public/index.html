<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk Guest Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        h1 { font-size: 24px; margin-bottom: 5px; color: #0f172a; }
        .subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .room-badge-box { background: #eff6ff; color: #1d4ed8; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 16px; margin-bottom: 25px; display: inline-block; }
        
        .nav-card { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-decoration: none; display: block; color: #1e293b; font-weight: bold; font-size: 16px; transition: all 0.2s; }
        .nav-card:hover { background: #e2e8f0; border-color: #94a3b8; }
        .nav-card span { font-size: 20px; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HostlyDesk Guest Portal</h1>
        <div class="subtitle">Welcome! How can we make your stay comfortable?</div>

        <div>
            <div class="room-badge-box" id="roomBadge">Your Current Location: Room 101</div>
        </div>

        <a id="foodMenuLink" href="/food-menu" class="nav-card">
            <span>🍔</span> Open Digital Food & F&B Menu
        </a>

        <a id="factsheetLink" href="/factsheet.html" class="nav-card">
            <span>📄</span> View Hotel Fact Sheet & Restaurant Menus
        </a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const room = urlParams.get('room') || '101';
        
        // Dynamically bind room numbers to ensure seamless navigation across pages
        document.getElementById('roomBadge').textContent = `Your Current Location: Room ${room}`;
        document.getElementById('foodMenuLink').href = `/food-menu?room=${room}`;
        document.getElementById('factsheetLink').href = `/factsheet.html?room=${room}`;
    </script>
</body>
</html>
