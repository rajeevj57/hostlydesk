<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Digital Key & Service Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #0f172a; color: #f8fafc; }
        .top-header { background: #0f172a; color: white; padding: 25px 20px 20px 20px; border-bottom: 2px solid #334155; }
        .brand-sub { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #38bdf8; font-weight: bold; margin-bottom: 5px; }
        h1 { margin: 0 0 5px 0; font-size: 26px; font-weight: 700; color: #f8fafc; }
        .welcome-text { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        .hotel-meta { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; border-top: 1px solid #1e293b; padding-top: 12px; margin-top: 10px; }
        
        .content-body { padding: 20px; max-width: 600px; margin: 0 auto; background: #1e293b; border-radius: 12px; margin-top: 20px; border: 1px solid #334155; margin-bottom: 30px; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; color: #f8fafc; }
        .section-desc { font-size: 13px; color: #94a3b8; margin-bottom: 15px; }
        
        .search-box { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; box-sizing: border-box; margin-bottom: 15px; font-size: 14px; outline: none; }
        .search-box:focus { border-color: #38bdf8; }

        .dept-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
        .dept-tab { background: #334155; color: #cbd5e1; border: none; padding: 7px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 600; }
        .dept-tab.active { background: #38bdf8; color: #0f172a; }

        .services-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; max-height: 320px; overflow-y: auto; padding-right: 4px; }
        .service-card { background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .service-card.selected { border-color: #38bdf8; background: #1e3a8a; }
        .service-card h4 { margin: 0 0 5px 0; font-size: 14px; color: #f8fafc; font-weight: 600; }
        .service-card p { margin: 0; font-size: 12px; color: #94a3b8; }

        .btn-submit { width: 100%; background: #d97706; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-submit:hover { background: #b45309; }
        
        .success-msg { color: #22c55e; text-align: center; margin-top: 15px; font-weight: bold; display: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="brand-sub">HostlyDesk · Digital Key</div>
        <h1 id="roomTitle">Room 305</h1>
        <div class="welcome-text">Welcome, Guest</div>
        <div class="hotel-meta">
            <span>HostlyDesk Hotel</span>
            <span>Checkout 11:00 AM</span>
        </div>
    </div>

    <div class="content-body">
        <div class="section-title">Need something?</div>
        <div class="section-desc">Type keywords (e.g., soup, chicken tikka) or select a tab to search through uploaded menu items.</div>

        <!-- Department / Category Tabs -->
        <div class="dept-tabs" id="deptTabs"></div>

        <!-- Keyword search filter -->
        <input type="text" id="keywordSearch" class="search-box" placeholder="🔍 Type keywords to search all menu items..." oninput="renderServices()">

        <!-- Dynamic Services Grid pulled from Manager's database -->
        <div class="services-grid" id="servicesGrid">
            <div style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 30px;">Loading menu items...</div>
        </div>

        <button class="btn-submit" onclick="submitRequest()">SEND REQUEST</button>
        <div id="successMsg" class="success-msg">Request sent successfully! The team has been notified.</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomNumber = urlParams.get('room') || '305';
        document.getElementById('roomTitle').innerText = `Room ${roomNumber}`;

        let departments = [];
        let services = [];
        let activeDepartmentId = null;
        let selectedServices = new Set();

        async function loadData() {
            try {
                const [deptRes, servRes] = await Promise.all([
                    fetch('/api/departments'),
                    fetch('/api/department-services')
                ]);
                departments = await deptRes.json();
                services = await servRes.json();

                if (departments.length > 0) {
                    activeDepartmentId = departments[0].id;
                }
                renderTabs();
                renderServices();
            } catch (err) {
                console.error('Failed to load portal data');
            }
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('deptTabs');
            tabsContainer.innerHTML = departments.map(d => `
                <button class="dept-tab ${d.id === activeDepartmentId ? 'active' : ''}" onclick="switchDept(${d.id})">
                    ${d.name}
                </button>
            `).join('');
        }

        function switchDept(deptId) {
            activeDepartmentId = deptId;
            document.getElementById('keywordSearch').value = '';
            renderTabs();
            renderServices();
        }

        function renderServices() {
            const grid = document.getElementById('servicesGrid');
            const searchTerm = document.getElementById('keywordSearch').value.toLowerCase().trim();

            let filteredServices = services.filter(s => s.department_id === activeDepartmentId);

            // Flexible search across active tab
            if (searchTerm) {
                const keywords = searchTerm.split(' ');
                filteredServices = filteredServices.filter(s => {
                    const name = s.name.toLowerCase();
                    return keywords.every(kw => name.includes(kw));
                });
            }

            // Fallback: if nothing matches in current tab, search across ALL parsed menu items automatically
            if (filteredServices.length === 0 && searchTerm) {
                filteredServices = services.filter(s => {
                    const name = s.name.toLowerCase();
                    const keywords = searchTerm.split(' ');
                    return keywords.every(kw => name.includes(kw));
                });
            }

            if (filteredServices.length === 0) {
                grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #94a3b8; padding: 30px; font-size: 13px;">No items found matching your search.</div>';
                return;
            }

            grid.innerHTML = filteredServices.map(s => {
                const isSelected = selectedServices.has(s.name);
                return `
                    <div class="service-card ${isSelected ? 'selected' : ''}" onclick="toggleService('${s.name}')">
                        <h4>${s.name}</h4>
                        ${s.price && s.price > 0 ? `<p>₹${s.price}</p>` : '<p>Complimentary</p>'}
                    </div>
                `;
            }).join('');
        }

        function toggleService(name) {
            if (selectedServices.has(name)) {
                selectedServices.delete(name);
            } else {
                selectedServices.add(name);
            }
            renderServices();
        }

        async function submitRequest() {
            if (selectedServices.size === 0) {
                alert('Please tap at least one item from the menu.');
                return;
            }

            const activeDept = departments.find(d => d.id === activeDepartmentId);
            const deptName = activeDept ? activeDept.name : 'Front Office';
            const itemsList = Array.from(selectedServices).join(', ');

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room: roomNumber,
                        department: deptName,
                        items: itemsList
                    })
                });

                if (res.ok) {
                    selectedServices.clear();
                    document.getElementById('keywordSearch').value = '';
                    renderServices();
                    
                    const msg = document.getElementById('successMsg');
                    msg.style.display = 'block';
                    setTimeout(() => { msg.style.display = 'none'; }, 4000);
                } else {
                    alert('Failed to send request. Please try again.');
                }
            } catch (e) {
                alert('Network error.');
            }
        }

        loadData();
    </script>
</body>
</html>
