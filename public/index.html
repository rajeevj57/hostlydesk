<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HostlyDesk - Guest Service Concierge</title>
  <style>
    :root {
      --primary-color: #1a365d;
      --secondary-color: #2b6cb0;
      --bg-color: #f7fafc;
      --card-bg: #ffffff;
      --text-color: #2d3748;
      --accent-color: #38a169;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .hotel-title {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin: 0 0 4px 0;
    }

    .room-badge {
      display: inline-block;
      background: #ebf8ff;
      color: var(--secondary-color);
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 0.9rem;
    }

    .quick-links {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .link-btn {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: #edf2f7;
      color: var(--primary-color);
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      border: 1px solid #e2e8f0;
      transition: background 0.2s;
    }

    .link-btn:hover {
      background: #e2e8f0;
    }

    .tab-container {
      display: flex;
      border-bottom: 2px solid #edf2f7;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: #718096;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: var(--secondary-color);
      border-bottom-color: var(--secondary-color);
    }

    .section-content {
      display: none;
    }

    .section-content.active {
      display: block;
    }

    .option-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .checkbox-label:hover {
      background-color: #f8fafc;
    }

    .checkbox-label input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: var(--secondary-color);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #2f855a;
    }

    .status-msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      display: none;
    }

    .status-msg.success {
      display: block;
      background-color: #f0fff4;
      color: #276749;
      border: 1px solid #c6f6d5;
    }

    .status-msg.error {
      display: block;
      background-color: #fff5f5;
      color: #c53030;
      border: 1px solid #fed7d7;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1 class="hotel-title" id="displayHotelName">Loading Hotel...</h1>
      <span class="room-badge" id="displayRoom">Room --</span>
    </div>

    <!-- Quick Document Links -->
    <div class="quick-links">
      <a href="#" id="menuLink" target="_blank" class="link-btn" style="display: none;">📖 Digital Menu</a>
      <a href="#" id="factSheetLink" target="_blank" class="link-btn" style="display: none;">📄 Fact Sheet</a>
    </div>

    <!-- Department Selector Tabs -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchDepartment('housekeeping')">Housekeeping</button>
      <button class="tab-btn" onclick="switchDepartment('kitchen')">Kitchen Service</button>
      <button class="tab-btn" onclick="switchDepartment('frontoffice')">Front Office</button>
    </div>

    <!-- Housekeeping Section -->
    <div id="housekeeping" class="section-content active">
      <div class="option-group">
        <label class="checkbox-label"><input type="checkbox" value="Extra Towels"> Extra Towels</label>
        <label class="checkbox-label"><input type="checkbox" value="Water Bottles"> Water Bottles</label>
        <label class="checkbox-label"><input type="checkbox" value="Room Cleaning Request"> Room Cleaning Request</label>
        <label class="checkbox-label"><input type="checkbox" value="Extra Pillow / Blanket"> Extra Pillow / Blanket</label>
        <label class="checkbox-label"><input type="checkbox" value="Toiletries Refill"> Toiletries Refill</label>
      </div>
    </div>

    <!-- Kitchen Section -->
    <div id="kitchen" class="section-content">
      <div class="option-group">
        <label class="checkbox-label"><input type="checkbox" value="Tea / Coffee Request"> Tea / Coffee Request</label>
        <label class="checkbox-label"><input type="checkbox" value="In-Room Dining Order"> In-Room Dining Order</label>
        <label class="checkbox-label"><input type="checkbox" value="Clear Used Plates / Trays"> Clear Used Plates / Trays</label>
        <label class="checkbox-label"><input type="checkbox" value="Cutlery / Glasses Request"> Cutlery / Glasses Request</label>
      </div>
    </div>

    <!-- Front Office Section -->
    <div id="frontoffice" class="section-content">
      <div class="option-group">
        <label class="checkbox-label"><input type="checkbox" value="Luggage Assistance"> Luggage Assistance</label>
        <label class="checkbox-label"><input type="checkbox" value="Wake-up Call Request"> Wake-up Call Request</label>
        <label class="checkbox-label"><input type="checkbox" value="Express Check-Out Inquiry"> Express Check-Out Inquiry</label>
        <label class="checkbox-label"><input type="checkbox" value="Duty Manager Assistance"> Duty Manager Assistance</label>
      </div>
    </div>

    <button class="submit-btn" onclick="sendRequest()">Send Request to Staff</button>
    <div id="statusMessage" class="status-msg"></div>
  </div>

  <script>
    let currentDepartment = 'housekeeping';
    let hotelId = '';
    let roomNumber = '';

    // Extract URL Parameters & Fetch Hotel Details
    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      hotelId = urlParams.get('hotelId') || urlParams.get('hotel');
      roomNumber = urlParams.get('room') || '101';

      document.getElementById('displayRoom').innerText = `Room ${roomNumber}`;

      if (!hotelId) {
        document.getElementById('displayHotelName').innerText = "Hotel Not Specified";
        showStatus("Invalid access URL. Missing hotel details.", "error");
        return;
      }

      try {
        const response = await fetch(`/api/hotels/${hotelId}`);
        const data = await response.json();

        if (data.success && data.hotel) {
          document.getElementById('displayHotelName').innerText = data.hotel.hotelName || "Guest Concierge";

          // Show Menu Link if available
          if (data.hotel.menuPdfUrl) {
            const menuLink = document.getElementById('menuLink');
            menuLink.href = data.hotel.menuPdfUrl;
            menuLink.style.display = 'inline-block';
          }

          // Show Fact Sheet Link if available
          if (data.hotel.factSheetUrl) {
            const factSheetLink = document.getElementById('factSheetLink');
            factSheetLink.href = data.hotel.factSheetUrl;
            factSheetLink.style.display = 'inline-block';
          }
        } else {
          document.getElementById('displayHotelName').innerText = "Hotel Guest Concierge";
        }
      } catch (err) {
        console.error("Error fetching hotel setup:", err);
        document.getElementById('displayHotelName').innerText = "Hotel Guest Concierge";
      }
    });

    // Switch between department tabs
    function switchDepartment(dept) {
      currentDepartment = dept;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section-content').forEach(sec => sec.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(dept).classList.add('active');
    }

    // Submit request to server
    async function sendRequest() {
      const activeSection = document.getElementById(currentDepartment);
      const selectedBoxes = activeSection.querySelectorAll('input[type="checkbox"]:checked');
      
      const selectedItems = Array.from(selectedBoxes).map(box => box.value);

      if (selectedItems.length === 0) {
        showStatus("Please select at least one item or service.", "error");
        return;
      }

      showStatus("Sending request...", "success");

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            hotelId: hotelId,
            room: roomNumber,
            department: currentDepartment,
            items: selectedItems
          })
        });

        const result = await response.json();

        if (result.success) {
          showStatus("✓ Request sent to staff successfully!", "success");
          selectedBoxes.forEach(box => box.checked = false);
        } else {
          showStatus(result.message || "Failed to deliver request.", "error");
        }
      } catch (err) {
        console.error("Submission error:", err);
        showStatus("Network error. Please try again.", "error");
      }
    }

    function showStatus(text, type) {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.innerText = text;
      statusDiv.className = `status-msg ${type}`;
    }
  </script>
</body>
</html>
