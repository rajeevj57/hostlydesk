<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Guest Dining Menu</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { background: #0f172a; color: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
        .search-box { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        .search-box:focus { border-color: #2563eb; }
        .menu-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .item-info h4 { margin: 0 0 5px 0; font-size: 16px; color: #0f172a; }
        .item-info p { margin: 0; font-size: 13px; color: #64748b; }
        .item-price { font-weight: bold; color: #2563eb; margin-top: 5px; font-size: 14px; }
        .add-btn { background: #16a34a; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .add-btn:hover { background: #15803d; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .order-btn { background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .pdf-banner { background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; }
        .pdf-banner a { color: #0284c7; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Room Dining & Menu</h2>
            <div id="roomDisplay" style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Loading room...</div>
        </div>

        <!-- Master Menu Document Link for Guests -->
        <div id="masterMenuLinkContainer" style="display: none;">
            <div class="pdf-banner" id="pdfBannerText">
                📄 View Master Menu Document: <a id="pdfAnchor" href="#" target="_blank">Open Menu File</a>
            </div>
        </div>

        <!-- Instant Search Bar -->
        <input type="text" id="searchInput" class="search-box" placeholder="Type 1-2 words (e.g., tikka, coffee, soup)..." oninput="filterMenuItems()">

        <div id="menuContainer">
            <p style="text-align: center; color: #64748b;">Loading menu items...</p>
        </div>
    </div>

    <!-- Floating Cart Bar -->
    <div class="cart-bar" id="cartBar" style="display: none;">
        <div>
            <span id="cartCount">0</span> items selected
        </div>
        <button class="order-btn" onclick="submitOrder()">Place Order Now</button>
    </div>

    <script>
        let allMenuItems = [];
        let cart = {};
        const urlParams = new URLSearchParams(window.location.search);
        const roomNumber = urlParams.get('room') || 'General';
        document.getElementById('roomDisplay').textContent = `Room / Location: ${roomNumber}`;

        async function loadData() {
            try {
                // Fetch menu items for search & order
                const res = await fetch('/api/food-items');
                allMenuItems = await res.json();
                renderMenu(allMenuItems);

                // Fetch uploaded master documents
                const docRes = await fetch('/api/factsheet');
                const docData = await docRes.json();
                if (docData.documents && docData.documents.menus && docData.documents.menus.length > 0) {
                    const latestMenu = docData.documents.menus[docData.documents.menus.length - 1];
                    if (latestMenu.path) {
                        document.getElementById('pdfAnchor').href = latestMenu.path;
                        document.getElementById('pdfAnchor').textContent = latestMenu.title || 'Open PDF Menu';
                        document.getElementById('masterMenuLinkContainer').style.display = 'block';
                    }
                }
            } catch (e) {
                document.getElementById('menuContainer').innerHTML = '<p style="text-align:center; color:red;">Failed to load menu.</p>';
            }
        }

        function renderMenu(items) {
            const container = document.getElementById('menuContainer');
            if (items.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#64748b;">No items available right now.</p>';
                return;
            }

            let html = '';
            items.forEach(item => {
                html += `
                    <div class="menu-card">
                        <div class="item-info">
                            <h4>${item.icon || '🍽️'} ${item.name}</h4>
                            <p>${item.description || item.category}</p>
                            <div class="item-price">₹${item.price}</div>
                        </div>
                        <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ Add</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function filterMenuItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMenuItems.filter(i => 
                i.name.toLowerCase().includes(query) || 
                (i.category && i.category.toLowerCase().includes(query)) ||
                (i.description && i.description.toLowerCase().includes(query))
            );
            renderMenu(filtered);
        }

        function addToCart(name, price) {
            if (!cart[name]) {
                cart[name] = { name, price, qty: 0 };
            }
            cart[name].qty += 1;
            updateCartBar();
        }

        function updateCartBar() {
            let totalCount = 0;
            Object.values(cart).forEach(i => totalCount += i.qty);
            
            const bar = document.getElementById('cartBar');
            if (totalCount > 0) {
                bar.style.display = 'flex';
                document.getElementById('cartCount').textContent = totalCount;
            } else {
                bar.style.display = 'none';
            }
        }

        async function submitOrder() {
            let orderSummary = Object.values(cart).map(i => `${i.qty}x ${i.name}`).join(', ');
            
            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        room: roomNumber,
                        department: 'Kitchen / F&B',
                        items: orderSummary
                    })
                });

                if (res.ok) {
                    alert('Order placed successfully! Sent to Kitchen department.');
                    cart = {};
                    updateCartBar();
                } else {
                    alert('Failed to place order.');
                }
            } catch (e) {
                alert('Connection error.');
            }
        }

        loadData();
    </script>
</body>
</html>
