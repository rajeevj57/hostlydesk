<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1b263b; padding: 30px; border-radius: 8px; }
        h1 { text-align: center; color: #4ea8de; margin-bottom: 30px; }
        .card { background: #22223b; padding: 20px; border-radius: 6px; margin-bottom: 25px; border: 1px solid #415a77; }
        label { display: block; margin-bottom: 8px; color: #e0e1dd; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; margin-bottom: 15px; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1d3557; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #457b9d; }
        .delete-btn { background: #e63946; width: auto; padding: 6px 12px; font-size: 14px; float: right; border-radius: 4px; cursor: pointer; border: none; color: white; }
        .delete-btn:hover { background: #d90429; }
        .row-item { display: flex; justify-content: space-between; align-items: center; background: #0d1b2a; padding: 12px; margin-top: 8px; border-radius: 4px; font-size: 14px; }
        .status { text-align: center; margin-top: 10px; font-weight: bold; color: #4ea8de; }
        a.link { color: #4ea8de; text-decoration: none; font-weight: bold; }
        a.link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HostlyDesk Admin Panel</h1>

        <!-- 1. Upload Master Menu -->
        <div class="card">
            <h3>Upload Master Menu / Document</h3>
            <form id="uploadForm">
                <label>Document Title</label>
                <input type="text" id="documentTitle" name="documentTitle" placeholder="e.g. Room Service Menu" required>
                <label>Select PDF or Text File</label>
                <input type="file" id="menuFile" name="menuFile" required>
                <button type="submit">Upload & Parse</button>
            </form>
            <div id="uploadStatus" class="status"></div>
        </div>

        <!-- 2. Manage Existing Menus (Delete Unwanted) -->
        <div class="card">
            <h3>Manage Uploaded Menus</h3>
            <div id="menuListContainer">Loading saved menus...</div>
        </div>

        <!-- 3. Manage Departments & Staff Links -->
        <div class="card">
            <h3>Manage Custom Departments & Staff Links</h3>
            <form id="departmentForm">
                <label>New Department Name (e.g., Spa, Valet, Pool Side)</label>
                <input type="text" id="departmentName" placeholder="Spa" required>
                
                <label>Services / Items (comma-separated)</label>
                <input type="text" id="departmentServices" placeholder="Body Massage, Facial, Steam Bath" required>
                
                <button type="submit">Create Department & Services</button>
            </form>
            <div id="deptStatus" class="status"></div>

            <h4 style="color:#4ea8de; margin-top:25px;">Active Department Dashboards</h4>
            <div id="deptListContainer">Loading departments...</div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                // Render Menus with Delete Option
                const menuContainer = document.getElementById('menuListContainer');
                if (!data.menus || data.menus.length === 0) {
                    menuContainer.innerHTML = '<p style="color:#a0aec0; font-size:14px;">No menus uploaded yet.</p>';
                } else {
                    menuContainer.innerHTML = '';
                    data.menus.forEach(m => {
                        const row = document.createElement('div');
                        row.className = 'row-item';
                        row.innerHTML = `
                            <span><strong>${m.title}</strong></span>
                            <button class="delete-btn" onclick="deleteMenu(${m.id})">Delete Menu</button>
                        `;
                        menuContainer.appendChild(row);
                    });
                }

                // Render Departments with Dashboard Links & Delete Option
                const deptContainer = document.getElementById('deptListContainer');
                if (!data.departments || data.departments.length === 0) {
                    deptContainer.innerHTML = '<p style="color:#a0aec0; font-size:14px;">No departments configured.</p>';
                } else {
                    deptContainer.innerHTML = '';
                    data.departments.forEach(d => {
                        const row = document.createElement('div');
                        row.className = 'row-item';
                        row.innerHTML = `
                            <span><strong>${d.name}</strong> <br><small style="color:#a0aec0;">Services: ${(d.services || []).join(', ')}</small></span>
                            <div>
                                <a class="link" href="/staff?dept=${encodeURIComponent(d.name)}" target="_blank" style="margin-right: 15px;">Open Staff Dashboard →</a>
                                <button class="delete-btn" onclick="deleteDept(${d.id})">Delete</button>
                            </div>
                        `;
                        deptContainer.appendChild(row);
                    });
                }
            } catch (err) {
                console.error('Error loading admin data');
            }
        }

        async function deleteMenu(id) {
            if (!confirm('Are you sure you want to delete this menu? It will instantly disappear from the guest panel.')) return;
            try {
                const res = await fetch(`/api/menus/${id}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadAdminData();
            } catch (err) {
                alert('Error deleting menu.');
            }
        }

        async function deleteDept(id) {
            if (!confirm('Are you sure you want to delete this department?')) return;
            try {
                const res = await fetch(`/api/departments/${id}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadAdminData();
            } catch (err) {
                alert('Error deleting department.');
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const status = document.getElementById('uploadStatus');
            status.textContent = 'Uploading & Parsing...';
            
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const result = await res.json();
                alert(result.message || 'Menu uploaded successfully!');
                status.textContent = '';
                location.reload();
            } catch (err) {
                alert('Upload failed.');
                status.textContent = '';
            }
        });

        document.getElementById('departmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('departmentName').value;
            const services = document.getElementById('departmentServices').value;
            const status = document.getElementById('deptStatus');
            status.textContent = 'Creating department...';

            try {
                const res = await fetch('/api/departments', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ departmentName: name, services: services })
                });
                const result = await res.json();
                alert(result.message || 'Department created successfully!');
                status.textContent = '';
                location.reload();
            } catch (err) {
                alert('Failed to create department.');
                status.textContent = '';
            }
        });

        loadAdminData();
    </script>
</body>
</html>
