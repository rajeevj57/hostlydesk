<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostlyDesk Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .card { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: #1e293b; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; color: #475569; }
    input[type="text"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    .doc-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .doc-row input[type="text"] { flex: 1; }
    .doc-row input[type="file"] { flex: 1.5; }
    .btn-add { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-bottom: 15px; }
    .btn-save { background: #10b981; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-weight: 600; }
    .status.success { background: #d1fae5; color: #065f46; display: block; }
    .status.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>

<div class="card">
  <h2>Hotel Configuration & PDF Manager</h2>
  <form id="adminForm">
    <div class="form-group">
      <label>Hotel ID (URL slug):</label>
      <input type="text" id="hotelId" value="hotel-kanha-shyam" required>
    </div>

    <div class="form-group">
      <label>Hotel Display Name:</label>
      <input type="text" id="hotelName" value="Hotel Kanha Shyam" required>
    </div>

    <h3>Telegram Department Chat IDs</h3>
    <div class="form-group">
      <label>Front Desk Chat ID:</label>
      <input type="text" id="frontDeskChatId" placeholder="-100xxxxxxxxxx">
    </div>
    <div class="form-group">
      <label>Housekeeping Chat ID:</label>
      <input type="text" id="housekeepingChatId" placeholder="-100xxxxxxxxxx">
    </div>
    <div class="form-group">
      <label>Kitchen / F&B Chat ID:</label>
      <input type="text" id="kitchenChatId" value="-1004301094020">
    </div>
    <div class="form-group">
      <label>Maintenance Chat ID:</label>
      <input type="text" id="maintenanceChatId" placeholder="-100xxxxxxxxxx">
    </div>

    <h3>Hotel PDF Directories (Multi-Upload)</h3>
    <div id="pdfContainer">
      <div class="doc-row">
        <input type="text" name="title_file_0" placeholder="Doc Name (e.g. Food Menu)" value="Digital Menu PDF">
        <input type="file" name="file_0" accept="application/pdf">
      </div>
    </div>

    <button type="button" class="btn-add" onclick="addPdfRow()">+ Add Another PDF Document</button>

    <button type="submit" class="btn-save">Save Hotel Configuration</button>
  </form>

  <div id="statusMsg" class="status"></div>
</div>

<script>
  let docCount = 1;

  function addPdfRow() {
    const container = document.getElementById('pdfContainer');
    const row = document.createElement('div');
    row.className = 'doc-row';
    row.innerHTML = `
      <input type="text" name="title_file_${docCount}" placeholder="Doc Name (e.g. Drink Menu / Fact Sheet)">
      <input type="file" name="file_${docCount}" accept="application/pdf">
    `;
    container.appendChild(row);
    docCount++;
  }

  document.getElementById('adminForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusMsg = document.getElementById('statusMsg');
    statusMsg.className = 'status';
    statusMsg.innerText = 'Uploading documents and saving configuration...';
    statusMsg.style.display = 'block';

    const formData = new FormData();
    formData.append('hotelId', document.getElementById('hotelId').value);
    formData.append('hotelName', document.getElementById('hotelName').value);
    formData.append('frontDeskChatId', document.getElementById('frontDeskChatId').value);
    formData.append('housekeepingChatId', document.getElementById('housekeepingChatId').value);
    formData.append('kitchenChatId', document.getElementById('kitchenChatId').value);
    formData.append('maintenanceChatId', document.getElementById('maintenanceChatId').value);

    // Attach PDF files and titles dynamically
    const rows = document.querySelectorAll('.doc-row');
    rows.forEach((row, idx) => {
      const titleInput = row.querySelector('input[type="text"]');
      const fileInput = row.querySelector('input[type="file"]');
      
      if (fileInput.files[0]) {
        const fieldName = `pdf_doc_${idx}`;
        formData.append(fieldName, fileInput.files[0]);
        formData.append(`title_${fieldName}`, titleInput.value || `Document ${idx+1}`);
      }
    });

    try {
      const res = await fetch('/api/admin/config', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      if (res.ok) {
        statusMsg.className = 'status success';
        statusMsg.innerText = 'Hotel setup and all PDFs updated successfully!';
      } else {
        throw new Error(data.error || 'Server processing error.');
      }
    } catch (err) {
      statusMsg.className = 'status error';
      statusMsg.innerText = err.message;
    }
  });
</script>
</body>
</html>
