<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1b263b;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #4ea8de;
            margin-bottom: 30px;
        }
        .card {
            background: #22223b;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #415a77;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #e0e1dd;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0d1b2a;
            border: 1px solid #415a77;
            color: #fff;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1d3557;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #457b9d;
        }
        #statusMessage {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #4ea8de;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HostlyDesk Admin Panel</h1>

        <!-- Upload Master Menu Form -->
        <div class="card">
            <h3>Upload Master Menu / Document</h3>
            <form id="uploadForm">
                <label for="documentTitle">Document Title (e.g., Room Service Menu, Spa Catalog)</label>
                <input type="text" id="documentTitle" name="documentTitle" placeholder="coffee shop" required>

                <label for="menuFile">Select PDF, TXT, or CSV File</label>
                <input type="file" id="menuFile" name="menuFile" required>

                <button type="submit" id="submitBtn">Upload & Parse</button>
            </form>
            <div id="statusMessage"></div>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const statusDiv = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            statusDiv.textContent = 'Uploading & Parsing... Please wait...';

            // Create an AbortController with a 5-minute timeout (300000ms) to prevent browser drops
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const result = await response.json();

                if (response.ok) {
                    alert('Success: ' + (result.message || 'Menu uploaded successfully!'));
                    location.reload();
                } else {
                    alert('Upload failed: ' + (result.error || 'Unknown server error'));
                }
            } catch (error) {
                clearTimeout(timeoutId);
                if (error.name === 'AbortError') {
                    alert('Upload timed out because the server took too long to respond.');
                } else {
                    alert('Upload failed due to a network error: ' + error.message);
                }
            } finally {
                submitBtn.disabled = false;
                statusDiv.textContent = '';
            }
        });
    </script>

</body>
</html>
