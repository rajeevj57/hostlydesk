<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Manager Admin Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 5px; color: #f8fafc; }
        .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .section { background: #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-top: 0; color: #38bdf8; }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #475569; }
        th { color: #38bdf8; }
        .row { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HostlyDesk Manager Dashboard</h1>
        <div class="subtitle">Upload operational files and configure searchable room dining menu items with categories.</div>

        <!-- Document Upload Section -->
        <div class="section">
            <h2>Upload Master Document / PDF</h2>
            <input type="text" id="docTitle" placeholder="Document Title (e.g., Room Service Menu)">
            <input type="text" id="docFilename" placeholder="Filename (e.g., menu.pdf)">
            <button onclick="uploadDocument()">Save Document Record</button>
            <div id="docAlert" style="margin-top: 10px; font-size: 13px;"></div>
        </div>

        <!-- Structured Menu Items Section with Category Column -->
        <div class="section">
            <h2>Publish Digital Searchable Menu Items</h2>
            <input type="text" id="menuTitleInput" value="Room Dining Menu" placeholder="Menu Title">
            
            <div class="row">
                <input type="text" id="itemName" placeholder="Item Name (e.g., Chicken Tikka)">
                <select id="itemCategory">
                    <option value="Starters">Starters</option>
                    <option value="Main Course" selected>Main Course</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Breads">Breads</option>
                </select>
                <input type="number" id="itemPrice" placeholder="Price (₹)" style="width: 120px;">
            </div>
            <input type="text" id="itemDesc" placeholder="Description (e.g., Tandoori spiced roasted chicken)">
            <button onclick="addMenuItemToList()">+ Add Item to Publish Queue</button>

            <table id="menuTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody">
                    <tr><td colspan="4" style="text-align:center; color:#94a3b8;">No items added yet.</td></tr>
                </tbody>
            </table>
            <br>
            <button onclick="publishMenuCatalog()" style="background: #16a34a;">Publish Menu to Guest Portal</button>
            <div id="publishAlert" style="margin-top: 10px; font-size: 13px;"></div>
        </div>
        
        <a href="/" style="color: #60a5fa; text-decoration: none; font-weight: bold;">← Back to Home Portal</a>
    </div>

    <script>
        let itemsQueue = [];

        async function uploadDocument() {
            const title = document.getElementById('docTitle').value;
            const filename = document.getElementById('docFilename').value;
            const alertBox = document.getElementById('docAlert');

            if (!title || !filename) {
                alertBox.textContent = 'Please fill in both fields.';
                alertBox.style.color = '#f87171';
                return;
            }

            try {
                const res = await fetch('/api/upload-document', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, filename })
                });
                if (res.ok) {
                    alertBox.textContent = 'Document record saved successfully!';
                    alertBox.style.color = '#4ade80';
                } else {
                    alertBox.textContent = 'Upload failed.';
                    alertBox.style.color = '#f87171';
                }
            } catch (e) {
                alertBox.textContent = 'Server error.';
                alertBox.style.color = '#f87171';
            }
        }

        function addMenuItemToList() {
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('itemCategory').value;
            const price = parseFloat(document.getElementById('itemPrice').value) || 0;
            const description = document.getElementById('itemDesc').value;

            if (!name) {
                alertButton = document.getElementById('publishAlert');
                alertButton.textContent = 'Item name is required.';
                alertButton.style.color = '#f87171';
                return;
            }

            itemsQueue.push({ name, category, price, description, icon: '🍽️' });
            renderQueue();

            // Clear inputs
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            document.getElementById('itemDesc').value = '';
        }

        function renderQueue() {
            const tbody = document.getElementById('menuTableBody');
            if (itemsQueue.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">No items added yet.</td></tr>';
                return;
            }

            let html = '';
            itemsQueue.forEach((item, index) => {
                html += `<tr>
                    <td>${item.name}</td>
                    <td><span style="background:#0f172a; padding:3px 8px; border-radius:6px; font-size:12px; color:#38bdf8;">${item.category}</span></td>
                    <td>₹${item.price}</td>
                    <td>${item.description}</td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        async function publishMenuCatalog() {
            const menuTitle = document.getElementById('menuTitleInput').value;
            const publishAlert = document.getElementById('publishAlert');

            if (itemsQueue.length === 0) {
                publishAlert.textContent = 'Add at least one item before publishing.';
                publishAlert.style.color = '#f87171';
                return;
            }

            try {
                const res = await fetch('/api/upload-menu-items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ menuTitle, items: itemsQueue })
                });

                if (res.ok) {
                    publishAlert.textContent = 'Menu successfully published to guest portal!';
                    publishAlert.style.color = '#4ade80';
                } else {
                    publishAlert.textContent = 'Publish failed.';
                    publishAlert.style.color = '#f87171';
                }
            } catch (e) {
                publishAlert.textContent = 'Server connection error.';
                publishAlert.style.color = '#f87171';
            }
        }
    </script>
</body>
</html>
