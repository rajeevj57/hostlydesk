<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostlyDesk - Property Management Dashboard</title>
  <style>
    :root {
      --primary-navy: #0d1b3e;
      --accent-gold: #c2a649;
      --bg-slate: #f8fafc;
      --text-dark: #1e293b;
      --border-color: #cbd5e1;
      --card-bg: #ffffff;
      --success-green: #10b981;
      --error-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-slate); color: var(--text-dark); padding: 40px 20px; line-height: 1.5; }
    .container { max-width: 750px; margin: 0 auto; }
    .header-panel { background-color: var(--primary-navy); color: #ffffff; padding: 28px; border-radius: 12px 12px 0 0; border-bottom: 4px solid var(--accent-gold); }
    .header-panel h1 { font-size: 1.8rem; font-weight: 700; }
    .header-panel p { color: #94a3b8; font-size: 0.95rem; margin-top: 6px; }
    .form-card { background: var(--card-bg); padding: 32px; border-radius: 0 0 12px 12px; border: 1px solid var(--border-color); border-top: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .section-block { margin-bottom: 28px; }
    .section-title { font-weight: 700; font-size: 1.1rem; color: var(--primary-navy); border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 16px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #475569; }
    .form-group label span { color: var(--error-red); }
    input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; background-color: #fff; }
    textarea { height: 100px; resize: vertical; }
    .upload-area { background-color: #f8fafc; border: 2px dashed var(--border-color); padding: 18px; border-radius: 8px; text-align: center; }
    .btn { display: block; width: 100%; padding: 14px; background-color: var(--primary-navy); color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-gold { background-color: var(--accent-gold); margin-top: 10px; }
    #opsSection { display: none; margin-top: 32px; padding-top: 24px; border-top: 2px dashed var(--border-color); }
    .status-banner { margin-top: 20px; padding: 12px 16px; border-radius: 8px; font-weight: 600; text-align: center; font-size: 0.95rem; display: none; }
    .status-banner.success { display: block; background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-banner.error { display: block; background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-banner.loading { display: block; background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <h1>HostlyDesk Management Console</h1>
    <p>Configure Telegram notifications, Wi-Fi details, and guest media guides.</p>
  </div>

  <div class="form-card">
    <!-- STAGE 1 -->
    <div class="section-block">
      <div class="section-title">⚙️ Stage 1: Hotel Identification & Telegram Setup</div>
      <form id="configForm">
        <div class="form-group">
          <label for="hotelId">Hotel Slug ID <span>*</span></label>
          <input type="text" id="hotelId" placeholder="e.g. hotel-kanha-shyam" required>
        </div>

        <div class="form-group">
          <label for="hotelName">Display Hotel Name <span>*</span></label>
          <input type="text" id="hotelName" placeholder="e.g. Hotel Kanha Shyam" required>
        </div>

        <div class="form-group">
          <label for="frontOfficeChatId">Front Office Telegram Group Chat ID <span>*</span></label>
          <input type="text" id="frontOfficeChatId" placeholder="-100123456789" required>
        </div>

        <div class="form-group">
          <label for="housekeepingChatId">Housekeeping Telegram Group Chat ID <span>*</span></label>
          <input type="text" id="housekeepingChatId" placeholder="-100123456789" required>
        </div>

        <div class="form-group">
          <label for="kitchenChatId">Kitchen Telegram Group Chat ID <span>*</span></label>
          <input type="text" id="kitchenChatId" placeholder="-100123456789" required>
        </div>

        <button type="submit" class="btn">Save & Initialize Operations Dashboard →</button>
      </form>
    </div>

    <!-- STAGE 2 -->
    <div id="opsSection">
      <div class="section-title">📌 Stage 2: Guest Experience & Information Content</div>
      <form id="opsForm" enctype="multipart/form-data">
        <input type="hidden" id="opsHotelId" name="hotelId">

        <div class="form-group">
          <label for="wifiName">📶 Wi-Fi Network Name (SSID)</label>
          <input type="text" id="wifiName" name="wifiName" placeholder="e.g. Guest_WiFi_5G">
        </div>

        <div class="form-group">
          <label for="wifiPassword">🔑 Wi-Fi Password</label>
          <input type="text" id="wifiPassword" name="wifiPassword" placeholder="e.g. Welcome2026">
        </div>

        <div class="form-group">
          <label>🍽️ Room Service & Bar Menu (PDF or Image)</label>
          <div class="upload-area">
            <input type="file" name="menuPdf" accept=".pdf,image/*">
          </div>
        </div>

        <div class="form-group">
          <label>ℹ️ Hotel Information Directory / Fact Sheet</label>
          <div class="upload-area">
            <input type="file" name="factSheetPdf" accept=".pdf,image/*">
          </div>
        </div>

        <div class="form-group">
          <label for="nearbyPlaces">📍 Local Attractions & Recommendations</label>
          <textarea id="nearbyPlaces" name="nearbyPlaces" placeholder="• City Mall — 1.5 km&#10;• Railway Station — 3 km"></textarea>
        </div>

        <button type="submit" class="btn btn-gold">Publish Content Live to Guest View</button>
      </form>
    </div>

    <div id="statusBanner" class="status-banner"></div>
  </div>
</div>

<script>
  function showStatus(message, type) {
    const banner = document.getElementById('statusBanner');
    banner.className = `status-banner ${type}`;
    banner.textContent = message;
  }

  document.getElementById('configForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showStatus('Saving initial parameters...', 'loading');

    const hotelId = document.getElementById('hotelId').value.trim();
    const payload = {
      hotelId: hotelId,
      hotelName: document.getElementById('hotelName').value.trim(),
      frontOfficeChatId: document.getElementById('frontOfficeChatId').value.trim(),
      housekeepingChatId: document.getElementById('housekeepingChatId').value.trim(),
      kitchenChatId: document.getElementById('kitchenChatId').value.trim()
    };

    try {
      const res = await fetch('/api/hotels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showStatus('✓ Stage 1 saved! Complete Stage 2 options below.', 'success');
        document.getElementById('opsHotelId').value = hotelId;
        document.getElementById('opsSection').style.display = 'block';
      } else {
        showStatus('Error saving configurations.', 'error');
      }
    } catch (err) {
      showStatus('Network connection error.', 'error');
    }
  });

  document.getElementById('opsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    showStatus('Uploading content live...', 'loading');

    const formData = new FormData(e.target);

    try {
      const res = await fetch('/api/hotels/content', {
        method: 'POST',
        body: formData
      });
      const data = await res.json();

      if (res.ok && data.success) {
        showStatus('✓ Details published live to guest view!', 'success');
      } else {
        showStatus('Upload failed. Please complete Stage 1 first.', 'error');
      }
    } catch (err) {
      showStatus('Failed to connect to server.', 'error');
    }
  });
</script>
</body>
</html>
