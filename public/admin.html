<form id="hotelForm">
  <label for="hotelId">Hotel ID (Slug):</label>
  <input type="text" id="hotelId" placeholder="e.g. hotel-kanha-shyam" required>

  <label for="hotelName">Property Name:</label>
  <input type="text" id="hotelName" placeholder="e.g. Hotel Kanha Shyam" required>

  <label for="frontOfficeChatId">Front Office Telegram Chat ID:</label>
  <input type="text" id="frontOfficeChatId" placeholder="e.g. -1004406590863" required>

  <label for="housekeepingChatId">Housekeeping Telegram Chat ID:</label>
  <input type="text" id="housekeepingChatId" placeholder="e.g. -1005506590864" required>

  <label for="kitchenChatId">Kitchen / Room Service Telegram Chat ID:</label>
  <input type="text" id="kitchenChatId" placeholder="e.g. -1006606590865" required>

  <button type="submit">Save Hotel Property</button>
</form>
