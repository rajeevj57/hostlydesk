<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Manager Dashboard - HostlyDesk</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-bottom: 5px; color: #0f172a; text-align: center; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .section-box { background: #f1f5f9; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section-title { font-weight: bold; font-size: 16px; margin-bottom: 10px; color: #334155; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #475569; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        .upload-btn { background: #2563eb; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 14px; width: 100%; }
        .upload-btn:hover { background: #1d4ed8; }

        .alert { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; font-weight: bold; text-align: center; display: none; }
        .helper-text { font-size: 11px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏨 Hotel Manager Control Center</h1>
        <div class="subtitle">Upload your designer PDF menu. It will automatically be made viewable and searchable for guests!</div>

        <div class="section-box">
            <div class="section-title">📄 Upload Designer Menu PDF</div>
            <div class="form-group">
                <label>Document Title (e.g., Main Restaurant Menu):</label>
                <input type="text" id="docTitle" class="form-control" value="Main Restaurant Menu">
            </div>
            <div class="form-group">
                <label>Select PDF File from Computer:</label>
                <input type="file" id="pdfFile" class="form-control" accept="application/pdf">
                <div class="helper-text">This will be saved for guest viewing AND parsed into clickable items automatically.</div>
            </div>
            <button type="button" class="upload-btn" onclick="uploadDocument()">Upload & Auto-Parse Menu</button>
            <div id="alertBox" class="alert"></div>
        </div>
    </div>

    <script>
        async function uploadDocument() {
            const title = document.getElementById('docTitle').value.trim();
            const fileInput = document.getElementById('pdfFile');
            const alertBox = document.getElementById('alertBox');

            if (fileInput.files.length === 0) {
                alertBox.textContent = 'Please select a PDF file first.';
                alertBox.style.background = '#fee2e2';
                alertBox.style.color = '#991b1b';
                alertBox.style.display = 'block';
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            alertBox.textContent = 'Processing and parsing PDF items... Please wait.';
            alertBox.style.background = '#e0f2fe';
            alertBox.style.color = '#0369a1';
            alertBox.style.display = 'block';

            reader.onload = async function(event) {
                const base64Data = event.target.result;

                const payload = {
                    title: title,
                    filename: file.name,
                    fileData: base64Data
                };

                try {
                    const res = await fetch('/api/upload-document', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await res.json();
                    if (res.ok) {
                        alertBox.textContent = 'Success! PDF uploaded, saved, and parsed into clickable menu items!';
                        alertBox.style.background = '#d1fae5';
                        alertBox.style.color = '#065f46';
                        alertBox.style.display = 'block';
                        fileInput.value = '';
                    } else {
                        throw new Error(result.error || 'Upload failed');
                    }
                } catch (err) {
                    alertBox.textContent = 'Failed to process document.';
                    alertBox.style.background = '#fee2e2';
                    alertBox.style.color = '#991b1b';
                    alertBox.style.display = 'block';
                }
            };

            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
