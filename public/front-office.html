<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Front Office Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 900px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { margin: 0; color: #38bdf8; font-size: 24px; }
        .badge { background: #334155; padding: 6px 12px; border-radius: 20px; font-size: 14px; }
        .orders-grid { display: grid; gap: 15px; }
        .order-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .order-card.in-progress { border-color: #eab308; background: #262c3d; }
        .order-info h3 { margin: 0 0 8px 0; font-size: 18px; color: #f1f5f9; }
        .order-info p { margin: 4px 0; color: #94a3b8; font-size: 14px; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-progress { background: #eab308; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-progress:hover { background: #ca8a04; }
        .btn-complete { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-complete:hover { background: #15803d; }
        .status-tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .status-pending { background: #dc2626; color: white; }
        .status-inprogress { background: #eab308; color: black; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Front Office Live Dashboard</h1>
            <div class="badge" id="orderCount">Active Requests: 0</div>
        </div>

        <div id="ordersContainer" class="orders-grid">
            <div style="color: #64748b; text-align: center; padding: 40px;">Listening for front office requests...</div>
        </div>
    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                
                const deptOrders = orders.filter(o => 
                    o.department && o.department.toLowerCase().includes('front office') && 
                    (o.status === 'Pending' || o.status === 'In Progress')
                );

                document.getElementById('orderCount').innerText = `Active Requests: ${deptOrders.length}`;

                const container = document.getElementById('ordersContainer');
                if (deptOrders.length === 0) {
                    container.innerHTML = '<div style="color: #64748b; text-align: center; padding: 40px; background: #1e293b; border-radius: 10px;">No active front office requests.</div>';
                    return;
                }

                container.innerHTML = deptOrders.map(o => {
                    const isInProgress = o.status === 'In Progress';
                    return `
                        <div class="order-card ${isInProgress ? 'in-progress' : ''}">
                            <div class="order-info">
                                <span class="status-tag ${isInProgress ? 'status-inprogress' : 'status-pending'}">${o.status}</span>
                                <h3>Room: ${o.room}</h3>
                                <p><strong>Department:</strong> ${o.department}</p>
                                <p><strong>Request:</strong> ${o.items}</p>
                                <p style="font-size: 12px; color: #64748b;">Time: ${o.timestamp}</p>
                            </div>
                            <div class="action-buttons">
                                ${!isInProgress ? `<button class="btn-progress" onclick="updateStatus(${o.id}, 'In Progress')">Acknowledge</button>` : ''}
                                <button class="btn-complete" onclick="updateStatus(${o.id}, 'Completed')">Mark Complete ✓</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to fetch orders');
            }
        }

        async function updateStatus(orderId, newStatus) {
            await fetch(`/api/orders/${orderId}/status`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchOrders();
        }

        setInterval(fetchOrders, 4000);
        fetchOrders();
    </script>
</body>
</html>
