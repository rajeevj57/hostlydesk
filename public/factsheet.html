<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Fact Sheet & Menus - HostlyDesk</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-bottom: 5px; color: #0f172a; text-align: center; }
        .subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .section-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-weight: bold; font-size: 15px; color: #2563eb; margin-bottom: 5px; }
        .section-content { color: #475569; font-size: 14px; line-height: 1.5; }
        .menu-link-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
        .menu-link-item:last-child { border-bottom: none; }
        .btn-view { background: #2563eb; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .btn-view:hover { background: #1d4ed8; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📖 Hotel Fact Sheet & Menus</h1>
        <div class="subtitle">Explore property guides and restaurant menus.</div>

        <div class="section-card">
            <div class="section-title">📄 General Fact Sheet</div>
            <div class="section-content" id="factsheetDoc">Loading document...</div>
        </div>

        <div class="section-card">
            <div class="section-title">🍽️ Restaurant & Bar Menus</div>
            <div class="section-content" id="menusListContainer">
                Loading restaurant menus...
            </div>
        </div>

        <a href="/" class="back-link">← Back to Guest Service Portal</a>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('/api/factsheet');
                const data = await res.json();
                
                if (data.documents) {
                    // Fact sheet file
                    const fsDoc = data.documents.factsheet || 'None uploaded yet';
                    document.getElementById('factsheetDoc').textContent = fsDoc !== 'None uploaded yet' ? `File: ${fsDoc}` : 'No fact sheet uploaded by manager yet.';

                    // Menus list
                    const menusContainer = document.getElementById('menusListContainer');
                    if (data.documents.menus && data.documents.menus.length > 0) {
                        menusContainer.innerHTML = '';
                        data.documents.menus.forEach(menu => {
                            menusContainer.innerHTML += `
                                <div class="menu-link-item">
                                    <div>
                                        <strong>${menu.title}</strong><br>
                                        <span style="font-size: 12px; color: #64748b;">${menu.filename}</span>
                                    </div>
                                    <a href="/kitchen" class="btn-view">View Menu</a>
                                </div>
                            `;
                        });
                    } else {
                        menusContainer.textContent = 'No menus uploaded yet.';
                    }
                }
            } catch (err) {
                console.error('Error loading factsheet data:', err);
            }
        }

        loadData();
    </script>
</body>
</html>
