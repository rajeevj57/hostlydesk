<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Concierge Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; }
    .dashboard { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 22px; color: #1a1a1a; }
    .header p { margin: 5px 0 0; color: #666; font-size: 14px; }
    
    .section-title { font-size: 16px; font-weight: 600; color: #333; margin: 20px 0 10px; }
    
    /* Document Viewer Buttons */
    .doc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .doc-btn { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; display: block; font-size: 14px; }
    
    /* Service Quick Action Cards */
    .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .service-card { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .service-card:hover { background: #f3f4f6; border-color: #d1d5db; }
    .service-card .icon { font-size: 28px; margin-bottom: 6px; }
    .service-card .title { font-weight: 600; font-size: 14px; color: #1f2937; }
    
    /* Request Form Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
    textarea { width: 100%; height: 90px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; }
    .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-close { background: #ef4444; color: white; border: none; padding: 8px; border-radius: 6px; margin-top: 8px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1 id="hotelNameDisplay">Welcome Guest</h1>
    <p>Room <strong id="roomDisplay">--</strong></p>
  </div>

  <!-- Manager Uploaded Documents -->
  <div class="section-title">Hotel Directory & Menus</div>
  <div class="doc-grid">
    <a id="menuPdfBtn" class="doc-btn" href="#" target="_blank" style="display:none;">📖 Digital Menu</a>
    <a id="factSheetBtn" class="doc-btn" href="#" target="_blank" style="display:none;">📄 Hotel Fact Sheet</a>
  </div>

  <!-- Request Department Services -->
  <div class="section-title">Request Hotel Services</div>
  <div class="service-grid">
    <div class="service-card" onclick="openRequest('Kitchen', 'Food Order / In-Room Dining')">
      <div class="icon">🍽️</div>
      <div class="title">In-Room Dining</div>
    </div>
    <div class="service-card" onclick="openRequest('Housekeeping', 'Extra Towels / Cleaning')">
      <div class="icon">🧹</div>
      <div class="title">Housekeeping</div>
    </div>
    <div class="service-card" onclick="openRequest('FrontDesk', 'Reception / Assistance')">
      <div class="icon">🛎️</div>
      <div class="title">Front Desk</div>
    </div>
    <div class="service-card" onclick="openRequest('Maintenance', 'AC / TV / Electrical Issue')">
      <div class="icon">🔧</div>
      <div class="title">Maintenance</div>
    </div>
  </div>
</div>

<!-- Request Popup Modal -->
<div id="requestModal" class="modal">
  <div class="modal-content">
    <h3 id="modalDeptTitle" style="margin-top:0;">Send Request</h3>
    <label for="requestNotes">Details / Special Instructions:</label>
    <textarea id="requestNotes" placeholder="Type items (e.g. 1x Paneer Tikka, 2x Water Bottles) or specific request..."></textarea>
    <button class="btn-submit" onclick="sendServiceRequest()">Send Request to Staff</button>
    <button class="btn-close" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const hotelId = urlParams.get('hotelId') || 'hotel-kanha-shyam';
  const room = urlParams.get('room') || '101';
  document.getElementById('roomDisplay').innerText = room;

  let activeDepartment = '';

  // Load Hotel Details & PDF Links uploaded by Manager
  async function loadHotelData() {
    try {
      const res = await fetch(`/api/hotel-config/${hotelId}`);
      if (res.ok) {
        const data = await res.json();
        if (data.hotelName) document.getElementById('hotelNameDisplay').innerText = data.hotelName;
        
        // Show Digital Menu if uploaded
        if (data.menuPdfUrl) {
          const menuBtn = document.getElementById('menuPdfBtn');
          menuBtn.href = data.menuPdfUrl;
          menuBtn.style.display = 'block';
        }
        
        // Show Fact Sheet if uploaded
        if (data.factSheetUrl) {
          const factBtn = document.getElementById('factSheetBtn');
          factBtn.href = data.factSheetUrl;
          factBtn.style.display = 'block';
        }
      }
    } catch (err) {
      console.log('Error fetching hotel configuration:', err);
    }
  }

  function openRequest(dept, placeholder) {
    activeDepartment = dept;
    document.getElementById('modalDeptTitle').innerText = `Request ${dept}`;
    document.getElementById('requestNotes').placeholder = `Type details for ${placeholder}...`;
    document.getElementById('requestModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('requestModal').style.display = 'none';
  }

  async function sendServiceRequest() {
    const text = document.getElementById('requestNotes').value.trim();
    if (!text) {
      alert('Please enter your request details before sending.');
      return;
    }

    const response = await fetch('/api/guest-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        hotelId,
        room,
        department: activeDepartment,
        requestText: text
      })
    });

    if (response.ok) {
      alert(`Your request has been dispatched directly to ${activeDepartment}!`);
      document.getElementById('requestNotes').value = '';
      closeModal();
    } else {
      alert('Failed to dispatch request. Please try again or inform Front Desk.');
    }
  }

  loadHotelData();
</script>

</body>
</html>
