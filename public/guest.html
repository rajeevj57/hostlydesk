<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guest Service & Interactive Menu</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 15px; padding-bottom: 90px; }
    
    .dashboard { max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 22px; color: #1a1a1a; }
    .header p { margin: 5px 0 0; color: #666; font-size: 14px; }
    
    /* Category Selector */
    .section-title { font-size: 16px; font-weight: 700; color: #111; margin: 20px 0 10px; display: flex; justify-content: space-between; align-items: center; }
    .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; -webkit-overflow-scrolling: touch; }
    .cat-tab { background: #f3f4f6; color: #4b5563; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1px solid #e5e7eb; }
    .cat-tab.active { background: #4f46e5; color: #ffffff; border-color: #4f46e5; }

    /* Interactive Menu Items */
    .menu-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid #f0f0f0; border-radius: 12px; padding: 12px 15px; }
    .item-info { flex: 1; padding-right: 10px; }
    .item-name { font-weight: 600; font-size: 15px; color: #1f2937; margin-bottom: 2px; }
    .item-desc { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .item-price { font-weight: 700; font-size: 14px; color: #059669; }
    
    /* Quantity Controls */
    .qty-controls { display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid #d1d5db; border-radius: 8px; padding: 4px 8px; }
    .qty-btn { background: #eef2ff; color: #4f46e5; border: none; width: 26px; height: 26px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .qty-btn:active { background: #c7d2fe; }
    .qty-count { font-weight: 700; font-size: 14px; color: #111; min-width: 16px; text-align: center; }

    /* PDF Reference Buttons */
    .doc-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
    .doc-btn { display: block; background: #f8fafc; color: #475569; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; font-weight: 600; text-align: center; text-decoration: none; font-size: 14px; }

    /* Quick Service Grid */
    .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .service-card { background: #fafafa; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; }
    .service-card .icon { font-size: 24px; margin-bottom: 4px; }
    .service-card .title { font-weight: 600; font-size: 13px; color: #1f2937; }

    /* Floating Cart Bar */
    .cart-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 450px; background: #10b981; color: white; padding: 12px 20px; border-radius: 30px; display: none; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); z-index: 9999; cursor: pointer; }
    .cart-info { display: flex; flex-direction: column; }
    .cart-count { font-size: 12px; font-weight: 500; opacity: 0.9; }
    .cart-total { font-size: 16px; font-weight: 800; }
    .cart-action { background: #ffffff; color: #10b981; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; }

    /* Service Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 15px; z-index: 10000; }
    .modal-content { background: white; padding: 20px; border-radius: 14px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; font-size: 14px; }
    .btn-submit { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-close { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .order-summary-list { max-height: 180px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; background: #f9fafb; font-size: 13px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1 id="hotelNameDisplay">Welcome Guest</h1>
    <p>Room <strong id="roomDisplay">--</strong></p>
  </div>

  <!-- Category Scroll Tabs -->
  <div class="section-title">
    <span>In-Room Dining Menu</span>
  </div>
  <div class="category-scroll">
    <div class="cat-tab active" onclick="filterCategory('Starters', this)">Starters</div>
    <div class="cat-tab" onclick="filterCategory('Main Course', this)">Main Course</div>
    <div class="cat-tab" onclick="filterCategory('Breads & Rice', this)">Breads & Rice</div>
    <div class="cat-tab" onclick="filterCategory('Beverages', this)">Beverages</div>
  </div>

  <!-- Interactive Food List -->
  <div class="menu-list" id="menuList">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- Direct PDF Links for Reference -->
  <div class="section-title">Hotel Directory & Info</div>
  <div class="doc-grid" id="docList">
    <p style="color:#999; font-size:13px; text-align:center;">Loading directory documents...</p>
  </div>

  <!-- Express Requests -->
  <div class="section-title">Express Hotel Services</div>
  <div class="service-grid">
    <div class="service-card" onclick="openRequest('Housekeeping', 'e.g. Extra Towels, Room Cleaning')">
      <div class="icon">🧹</div>
      <div class="title">Housekeeping</div>
    </div>
    <div class="service-card" onclick="openRequest('FrontDesk', 'e.g. Luggage Pickup, Wakeup Call')">
      <div class="icon">🛎️</div>
      <div class="title">Front Desk</div>
    </div>
    <div class="service-card" onclick="openRequest('Maintenance', 'e.g. AC Repair, Remote Control')">
      <div class="icon">🔧</div>
      <div class="title">Maintenance</div>
    </div>
    <div class="service-card" onclick="openRequest('Laundry', 'e.g. Express Laundry Pickup')">
      <div class="icon">🧺</div>
      <div class="title">Laundry</div>
    </div>
  </div>
</div>

<!-- Floating Cart Notification Bar -->
<div class="cart-bar" id="cartBar" onclick="openOrderModal()">
  <div class="cart-info">
    <span class="cart-count" id="cartItemCount">0 Items selected</span>
    <span class="cart-total" id="cartTotal">Total: ₹0</span>
  </div>
  <div class="cart-action">View Order 🛒</div>
</div>

<!-- Kitchen Order Review Modal -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <h3 style="margin:0; font-size:18px;">Confirm Dining Order</h3>
    <div class="order-summary-list" id="orderSummaryList"></div>
    <label style="font-size:13px; font-weight:600; color:#444;">Special Cooking Instructions / Requests:</label>
    <textarea id="kitchenNotes" placeholder="e.g. Make it less spicy, extra green chutney..."></textarea>
    <button class="btn-submit" onclick="submitKitchenOrder()">Send Order to Kitchen</button>
    <button class="btn-close" onclick="closeModal('orderModal')">Add More Items</button>
  </div>
</div>

<!-- Express Service Request Modal -->
<div id="requestModal" class="modal">
  <div class="modal-content">
    <h3 id="modalDeptTitle" style="margin:0; font-size:18px;">Send Request</h3>
    <label style="font-size:13px; font-weight:600; color:#444;">Instructions:</label>
    <textarea id="requestNotes"></textarea>
    <button class="btn-submit" onclick="sendServiceRequest()">Submit Request</button>
    <button class="btn-close" onclick="closeModal('requestModal')">Cancel</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const hotelId = urlParams.get('hotelId') || 'hotel-kanha-shyam';
  const room = urlParams.get('room') || '101';
  document.getElementById('roomDisplay').innerText = room;

  let activeDepartment = '';
  let activeCategory = 'Starters';
  let cart = {};

  // Sample Interactive Digital Menu Items
  const menuData = [
    { id: 'm1', name: 'Paneer Tikka Dry', category: 'Starters', price: 280, desc: 'Cottage cheese marinated in yogurt & spices' },
    { id: 'm2', name: 'Crispy Corn Salt & Pepper', category: 'Starters', price: 220, desc: 'Sweetcorn tossed with green chilies & pepper' },
    { id: 'm3', name: 'Veg Hara Bhara Kebab', category: 'Starters', price: 240, desc: 'Spinach & green pea patties crisp fried' },
    { id: 'm4', name: 'Dal Makhani', category: 'Main Course', price: 310, desc: 'Slow-cooked black lentils with butter & cream' },
    { id: 'm5', name: 'Paneer Butter Masala', category: 'Main Course', price: 340, desc: 'Paneer cubes in rich tomato gravy' },
    { id: 'm6', name: 'Mix Vegetable Handi', category: 'Main Course', price: 270, desc: 'Seasonal vegetables cooked in Indian herbs' },
    { id: 'm7', name: 'Butter Naan', category: 'Breads & Rice', price: 60, desc: 'Soft refined flour bread topped with butter' },
    { id: 'm8', name: 'Tandoori Roti', category: 'Breads & Rice', price: 35, desc: 'Whole wheat bread baked in clay oven' },
    { id: 'm9', name: 'Jeera Rice', category: 'Breads & Rice', price: 180, desc: 'Basmati rice tempered with cumin seeds' },
    { id: 'm10', name: 'Fresh Lime Soda', category: 'Beverages', price: 90, desc: 'Sweet, salted, or mixed' },
    { id: 'm11', name: 'Mineral Water (1L)', category: 'Beverages', price: 30, desc: 'Packaged drinking water' }
  ];

  function renderMenu() {
    const list = document.getElementById('menuList');
    list.innerHTML = '';

    const filtered = menuData.filter(item => item.category === activeCategory);
    filtered.forEach(item => {
      const qty = cart[item.id] ? cart[item.id].qty : 0;
      const el = document.createElement('div');
      el.className = 'menu-item';
      el.innerHTML = `
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          <div class="item-price">₹${item.price}</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
          <span class="qty-count">${qty}</span>
          <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
        </div>
      `;
      list.appendChild(el);
    });
  }

  function filterCategory(cat, tabEl) {
    activeCategory = cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
    tabEl.classList.add('active');
    renderMenu();
  }

  function updateQty(itemId, change) {
    const item = menuData.find(i => i.id === itemId);
    if (!cart[itemId]) {
      cart[itemId] = { name: item.name, price: item.price, qty: 0 };
    }
    
    cart[itemId].qty += change;
    if (cart[itemId].qty <= 0) {
      delete cart[itemId];
    }

    renderMenu();
    updateCartBar();
  }

  function updateCartBar() {
    const cartBar = document.getElementById('cartBar');
    let totalItems = 0;
    let totalPrice = 0;

    Object.values(cart).forEach(item => {
      totalItems += item.qty;
      totalPrice += (item.qty * item.price);
    });

    if (totalItems > 0) {
      document.getElementById('cartItemCount').innerText = `${totalItems} Item${totalItems > 1 ? 's' : ''} Selected`;
      document.getElementById('cartTotal').innerText = `Total: ₹${totalPrice}`;
      cartBar.style.display = 'flex';
    } else {
      cartBar.style.display = 'none';
    }
  }

  function openOrderModal() {
    const summary = document.getElementById('orderSummaryList');
    summary.innerHTML = '';
    let grandTotal = 0;

    Object.values(cart).forEach(item => {
      const lineTotal = item.qty * item.price;
      grandTotal += lineTotal;
      summary.innerHTML += `
        <div class="summary-row">
          <span>${item.qty}x ${item.name}</span>
          <strong>₹${lineTotal}</strong>
        </div>
      `;
    });

    summary.innerHTML += `
      <div class="summary-row" style="border-top:1px dashed #ccc; padding-top:6px; margin-top:6px; font-size:14px;">
        <strong>Total Amount:</strong>
        <strong style="color:#059669;">₹${grandTotal}</strong>
      </div>
    `;

    document.getElementById('orderModal').style.display = 'flex';
  }

  async function submitKitchenOrder() {
    let orderDetails = [];
    let grandTotal = 0;

    Object.values(cart).forEach(item => {
      orderDetails.push(`${item.qty}x ${item.name} (₹${item.qty * item.price})`);
      grandTotal += item.qty * item.price;
    });

    const notes = document.getElementById('kitchenNotes').value.trim();
    let fullRequestText = `ORDER SUMMARY:\n- ` + orderDetails.join('\n- ') + `\n\nTotal: ₹${grandTotal}`;
    if (notes) fullRequestText += `\nSpecial Notes: ${notes}`;

    const response = await fetch('/api/guest-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        hotelId,
        room,
        department: 'Kitchen',
        requestText: fullRequestText
      })
    });

    if (response.ok) {
      alert('Your dining order has been dispatched directly to the Kitchen staff!');
      cart = {};
      updateCartBar();
      renderMenu();
      closeModal('orderModal');
    } else {
      alert('Failed to send order. Please contact front desk.');
    }
  }

  async function loadHotelData() {
    try {
      const res = await fetch(`/api/hotel-config/${hotelId}`);
      if (res.ok) {
        const data = await res.json();
        if (data.hotelName) document.getElementById('hotelNameDisplay').innerText = data.hotelName;

        const docList = document.getElementById('docList');
        docList.innerHTML = '';

        if (data.documents && data.documents.length > 0) {
          data.documents.forEach(doc => {
            const a = document.createElement('a');
            a.className = 'doc-btn';
            a.innerText = `📄 View PDF: ${doc.title}`;
            a.href = `/api/view-pdf?url=${encodeURIComponent(doc.url)}`;
            a.target = '_blank';
            docList.appendChild(a);
          });
        } else {
          docList.innerHTML = '<p style="color:#888; font-size:13px; text-align:center;">No directory documents attached.</p>';
        }
      }
    } catch (err) {
      console.error('Error fetching hotel config:', err);
    }
  }

  function openRequest(dept, placeholder) {
    activeDepartment = dept;
    document.getElementById('modalDeptTitle').innerText = `Request ${dept}`;
    document.getElementById('requestNotes').placeholder = placeholder;
    document.getElementById('requestModal').style.display = 'flex';
  }

  function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
  }

  async function sendServiceRequest() {
    const text = document.getElementById('requestNotes').value.trim();
    if (!text) return alert('Please enter request details.');

    const response = await fetch('/api/guest-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ hotelId, room, department: activeDepartment, requestText: text })
    });

    if (response.ok) {
      alert(`Request sent to ${activeDepartment}!`);
      document.getElementById('requestNotes').value = '';
      closeModal('requestModal');
    } else {
      alert('Failed to send request.');
    }
  }

  renderMenu();
  loadHotelData();
</script>
</body>
</html>
