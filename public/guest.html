<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Guest Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1b263b; padding: 20px; border-radius: 8px; margin-bottom: 90px; }
        h1 { color: #4ea8de; text-align: center; font-size: 22px; }
        .room-bar { background: #22223b; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        input[type="text"] { width: 100%; padding: 12px; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        .section-card { background: #22223b; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #415a77; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #0d1b2a; padding: 10px; margin-top: 8px; border-radius: 4px; font-size: 14px; }
        button { padding: 6px 14px; background: #1d3557; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #457b9d; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1d3557; padding: 15px; text-align: center; border-top: 2px solid #4ea8de; display: none; z-index: 100; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HostlyDesk Guest Portal</h1>
        <div class="room-bar">
            <span>Room No: <strong>101</strong></span>
            <span style="color: #4ea8de;">Instant Service & Ordering</span>
        </div>

        <input type="text" id="searchInput" placeholder="Search keyword (e.g. fish, towel, ac, massage)..." oninput="filterCatalog()">

        <div id="catalogContainer">Loading menus and services...</div>
    </div>

    <div class="cart-bar" id="cartBar">
        <span id="cartCount" style="font-size: 16px;">0 items selected</span> 
        <button onclick="submitOrder()" style="background: #2a9d8f; margin-left: 15px;">Send Request to Staff</button>
    </div>

    <script>
        let allMenus = [];
        let allDepartments = [];
        let cart = [];

        const defaultDepartments = [
            { name: 'Housekeeping', services: ['Extra Towel', 'Bed Linen Change', 'Room Cleaning', 'Toiletries Refill'] },
            { name: 'Maintenance', services: ['AC Not Cooling', 'Plumbing / Leaking Tap', 'Electrical / Light Repair', 'TV / Remote Issue'] },
            { name: 'Front Office', services: ['Express Checkout', 'Wake-up Call', 'Luggage Assistance', 'Taxi Booking'] }
        ];

        async function loadData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                allMenus = data.menus || [];
                
                const dbDepts = data.departments || [];
                const mergedDeptsMap = new Map();
                
                defaultDepartments.forEach(d => mergedDeptsMap.set(d.name.toLowerCase(), d));
                dbDepts.forEach(d => mergedDeptsMap.set(d.name.toLowerCase(), d));
                
                allDepartments = Array.from(mergedDeptsMap.values());
                renderAll(allMenus, allDepartments);
            } catch (err) {
                document.getElementById('catalogContainer').innerHTML = '<p style="color:#ff6b6b; text-align:center;">Error loading catalog data.</p>';
            }
        }

        // Clean up weird PDF text formatting and automatically space out stuck prices
        function cleanText(text) {
            if (!text) return '';
            return text
                .replace(/`/g, '₹')
                // Automatically add clean spacing if numbers/prices are stuck directly to letters
                .replace(/([0-9₹]+)([a-zA-Z])/g, '$1 $2')
                .replace(/([a-zA-Z])([0-9₹]+)/g, '$1 $2')
                .replace(/[\u0000-\u001F\u007F-\u009F]/g, "")
                .trim();
        }

        function renderAll(menus, depts) {
            const container = document.getElementById('catalogContainer');
            container.innerHTML = '';

            depts.forEach(dept => {
                let itemsHTML = '';
                const services = dept.services || [];
                services.forEach(service => {
                    const cleanedService = cleanText(service);
                    itemsHTML += `
                        <div class="item-row">
                            <span>${cleanedService}</span>
                            <button onclick="addToCart('${dept.name}', '${cleanedService}')">Select +</button>
                        </div>
                    `;
                });
                container.innerHTML += `
                    <div class="section-card">
                        <h3 style="color:#4ea8de; margin-top:0;">${dept.name}</h3>
                        ${itemsHTML}
                    </div>
                `;
            });

            menus.forEach(menu => {
                let linesHTML = '';
                const lines = (menu.content || '').split('\n').filter(l => l.trim().length > 2);
                lines.forEach(line => {
                    const cleanedLine = cleanText(line);
                    if (cleanedLine) {
                        linesHTML += `
                            <div class="item-row">
                                <span>${cleanedLine}</span>
                                <button onclick="addToCart('Kitchen / F&B', '${cleanedLine.replace(/'/g, "")}')">Select +</button>
                            </div>
                        `;
                    }
                });
                container.innerHTML += `
                    <div class="section-card">
                        <h3 style="color:#4ea8de; margin-top:0;">Menu: ${menu.title}</h3>
                        <div style="max-height: 350px; overflow-y: auto;">${linesHTML || '<p style="color:#a0aec0; font-size:14px;">No text found in document.</p>'}</div>
                    </div>
                `;
            });
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                renderAll(allMenus, allDepartments);
                return;
            }

            const filteredDepts = allDepartments.map(dept => {
                const matched = (dept.services || []).filter(s => s.toLowerCase().includes(query));
                return matched.length > 0 || dept.name.toLowerCase().includes(query) ? { ...dept, services: matched.length > 0 ? matched : dept.services } : null;
            }).filter(Boolean);

            const filteredMenus = allMenus.map(menu => {
                const lines = (menu.content || '').split('\n').filter(l => l.toLowerCase().includes(query));
                return lines.length > 0 ? { ...menu, content: lines.join('\n') } : null;
            }).filter(Boolean);

            renderAll(filteredMenus, filteredDepts);
        }

        function addToCart(deptName, itemName) {
            cart.push({ department: deptName, item: itemName });
            document.getElementById('cartBar').style.display = 'block';
            document.getElementById('cartCount').textContent = cart.length + ' item(s) selected';
        }

        async function submitOrder() {
            if (cart.length === 0) return;
            const instructions = prompt('Any special instructions? (e.g. send immediately, urgent):', '') || 'None';
            
            const targetDept = cart[0].department;
            const itemNames = cart.map(c => c.item);

            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        roomNumber: '101',
                        department: targetDept,
                        items: itemNames,
                        instructions: instructions
                    })
                });
                const result = await res.json();
                alert(result.message);
                cart = [];
                document.getElementById('cartBar').style.display = 'none';
            } catch (err) {
                alert('Failed to send order. Please try again.');
            }
        }

        loadData();
    </script>
</body>
</html>
