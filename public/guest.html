<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Guest Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d1b2a; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #1b263b; padding: 20px; border-radius: 8px; }
        h1 { color: #4ea8de; text-align: center; font-size: 22px; }
        .room-bar { background: #22223b; padding: 10px; border-radius: 6px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"] { width: 100%; padding: 12px; background: #0d1b2a; border: 1px solid #415a77; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        .item-card { background: #22223b; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #415a77; }
        button { padding: 8px 14px; background: #1d3557; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #457b9d; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1d3557; padding: 15px; text-align: center; border-top: 2px solid #4ea8de; }
    </style>
</head>
<body>

    <div class="container" style="margin-bottom: 70px;">
        <h1>Welcome Guest</h1>
        <div class="room-bar">
            <span>Room No: <strong>101</strong></span>
            <span style="color: #4ea8de;">HostlyDesk Service</span>
        </div>

        <h3>Search Menus & Services</h3>
        <input type="text" id="searchInput" placeholder="Type keyword (e.g. coffee, starter, towel, ac)..." oninput="filterCatalog()">

        <div id="catalogContainer">Loading menus and services...</div>
    </div>

    <div class="cart-bar" id="cartBar" style="display:none;">
        <span id="cartCount">0 items selected</span> 
        <button onclick="submitOrder()" style="background: #2a9d8f; margin-left: 15px; font-weight: bold;">Send Request / Order</button>
    </div>

    <script>
        let allMenus = [];
        let cart = [];

        async function loadData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            allMenus = data.menus;
            renderCatalog(allMenus);
        }

        function renderCatalog(menus) {
            const container = document.getElementById('catalogContainer');
            if(menus.length === 0) {
                container.innerHTML = '<p style="color:#a0aec0; text-align:center;">No menus or hotel guides uploaded yet by admin.</p>';
                return;
            }
            container.innerHTML = '';
            menus.forEach(m => {
                const card = document.createElement('div');
                card.style.marginBottom = '20px';
                card.innerHTML = `
                    <h4 style="color:#4ea8de; margin-bottom:5px;">${m.title}</h4>
                    <div style="background:#0d1b2a; padding:10px; border-radius:4px; font-size:14px; white-space:pre-wrap; max-height:150px; overflow-y:auto;">${m.content}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if(!query) {
                renderCatalog(allMenus);
                return;
            }
            const filtered = allMenus.map(m => {
                const lines = m.content.split('\n').filter(l => l.toLowerCase().includes(query));
                return lines.length > 0 ? { title: m.title, content: lines.join('\n') } : null;
            }).filter(Boolean);

            const container = document.getElementById('catalogContainer');
            if(filtered.length === 0) {
                container.innerHTML = '<p style="color:#a0aec0; text-align:center;">No matching items found for your keyword.</p>';
            } else {
                renderCatalog(filtered);
            }
        }

        // Quick request helper for testing specific requests
        function addToCart(itemText) {
            cart.push(itemText);
            document.getElementById('cartBar').style.display = 'block';
            document.getElementById('cartCount').textContent = cart.length + ' item(s) selected';
        }

        async function submitOrder() {
            const promptText = prompt('Any special instructions? (e.g. Less spicy, send immediately):', '');
            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    roomNumber: '101',
                    department: 'Kitchen / Housekeeping',
                    items: cart.length > 0 ? cart : ['General Search Request'],
                    instructions: promptText || 'None'
                })
            });
            const result = await res.json();
            alert(result.message);
            cart = [];
            document.getElementById('cartBar').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
