<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Service - Digital Concierge</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
    .item-info { flex-grow: 1; }
    .item-title { font-weight: bold; color: #333; }
    .item-price { color: #666; font-size: 0.9em; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { background: #007bff; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; }
    .order-summary { margin-top: 20px; padding-top: 15px; border-top: 2px solid #2c3e50; }
    .send-btn { width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    .send-btn:disabled { background: #ccc; }
  </style>
</head>
<body>

<div class="container">
  <h2 id="hotelName">Hotel Concierge</h2>
  <p><strong>Room Number:</strong> <span id="roomDisplay">--</span></p>

  <h3>Food & Beverages Menu</h3>
  
  <div id="menuList">
    <!-- Interactive Menu Items -->
    <div class="menu-item" data-name="Paneer Tikka" data-price="280">
      <div class="item-info">
        <div class="item-title">Paneer Tikka</div>
        <div class="item-price">₹280</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="updateQty('Paneer Tikka', -1)">-</button>
        <span id="qty-Paneer Tikka">0</span>
        <button class="qty-btn" onclick="updateQty('Paneer Tikka', 1)">+</button>
      </div>
    </div>

    <div class="menu-item" data-name="Dal Makhani" data-price="240">
      <div class="item-info">
        <div class="item-title">Dal Makhani</div>
        <div class="item-price">₹240</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="updateQty('Dal Makhani', -1)">-</button>
        <span id="qty-Dal Makhani">0</span>
        <button class="qty-btn" onclick="updateQty('Dal Makhani', 1)">+</button>
      </div>
    </div>

    <div class="menu-item" data-name="Butter Naan" data-price="50">
      <div class="item-info">
        <div class="item-title">Butter Naan</div>
        <div class="item-price">₹50</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="updateQty('Butter Naan', -1)">-</button>
        <span id="qty-Butter Naan">0</span>
        <button class="qty-btn" onclick="updateQty('Butter Naan', 1)">+</button>
      </div>
    </div>
  </div>

  <div class="order-summary">
    <strong>Total: ₹<span id="totalPrice">0</span></strong>
    <button class="send-btn" id="orderBtn" onclick="submitOrder()" disabled>Send Room Order</button>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const hotelId = urlParams.get('hotelId') || 'hotel-kanha-shyam';
  const room = urlParams.get('room') || '101';
  document.getElementById('roomDisplay').innerText = room;

  const cart = {};
  const prices = { "Paneer Tikka": 280, "Dal Makhani": 240, "Butter Naan": 50 };

  function updateQty(item, change) {
    cart[item] = (cart[item] || 0) + change;
    if (cart[item] <= 0) delete cart[item];
    
    document.getElementById(`qty-${item}`).innerText = cart[item] || 0;
    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;
    for (let item in cart) {
      total += cart[item] * prices[item];
    }
    document.getElementById('totalPrice').innerText = total;
    document.getElementById('orderBtn').disabled = total === 0;
  }

  async function submitOrder() {
    let orderDetails = Object.keys(cart).map(i => `${cart[i]}x ${i}`).join(', ');
    let total = document.getElementById('totalPrice').innerText;

    const response = await fetch('/api/guest-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        hotelId,
        room,
        department: 'Kitchen',
        requestText: `Order: ${orderDetails} | Total: ₹${total}`
      })
    });

    if (response.ok) {
      alert('Your order for Paneer Tikka / items has been sent directly to the Kitchen!');
      location.reload();
    } else {
      alert('Failed to send order. Please try again.');
    }
  }
</script>
</body>
</html>
