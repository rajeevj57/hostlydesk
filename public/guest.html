<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostlyDesk - Guest Concierge</title>
  <style>
    :root {
      --primary: #1e293b;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .header h1 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wifi-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #eff6ff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #475569;
    }

    .btn-secondary:hover {
      background: #334155;
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .request-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    select, textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 500;
    }

    .loader {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="loader" class="loader">Loading guest concierge...</div>

    <div id="app" style="display: none;">
      <!-- Header -->
      <div class="header">
        <h1 id="hotelName">Hotel Concierge</h1>
        <p id="roomBadge">Room Guest</p>
      </div>

      <!-- Digital Menu & Factsheet -->
      <div class="card">
        <h2>📖 Hotel Information</h2>
        <div class="grid-buttons">
          <button id="menuBtn" class="btn">Digital Menu</button>
          <button id="factSheetBtn" class="btn btn-secondary">Fact Sheet</button>
        </div>
      </div>

      <!-- Wi-Fi Details -->
      <div class="card">
        <h2>📶 Wi-Fi Network</h2>
        <div class="wifi-details">
          <div><strong>Network:</strong> <span id="wifiName">Not configured</span></div>
          <div><strong>Password:</strong> <span id="wifiPassword">Not configured</span></div>
        </div>
      </div>

      <!-- Send Request to Department -->
      <div class="card">
        <h2>🛎️ Send Request</h2>
        <form id="requestForm" class="request-form">
          <select id="department" required>
            <option value="frontoffice">Front Office / Reception</option>
            <option value="housekeeping">Housekeeping</option>
            <option value="kitchen">In-Room Dining / Kitchen</option>
          </select>
          <textarea id="requestItems" rows="3" placeholder="Describe what you need (e.g., 2 extra towels, water bottles)..." required></textarea>
          <button type="submit" class="btn">Send Request</button>
        </form>
        <div id="statusMsg" class="status-msg"></div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hotelId = urlParams.get('hotelId');
    const room = urlParams.get('room') || 'Unassigned';

    let hotelData = null;

    // Load hotel config from backend
    async function loadHotelDetails() {
      if (!hotelId) {
        document.getElementById('loader').innerText = 'Invalid link. Hotel ID is missing.';
        return;
      }

      try {
        const response = await fetch(`/api/hotels/${encodeURIComponent(hotelId)}`);
        const result = await response.json();

        if (result.success && result.hotel) {
          hotelData = result.hotel;
          renderUI();
        } else {
          document.getElementById('loader').innerText = 'Hotel configuration not found.';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('loader').innerText = 'Error connecting to service.';
      }
    }

    function renderUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      document.getElementById('hotelName').innerText = hotelData.hotelName || 'Welcome';
      document.getElementById('roomBadge').innerText = `Room: ${room}`;

      document.getElementById('wifiName').innerText = hotelData.wifiName || 'Available at Reception';
      document.getElementById('wifiPassword').innerText = hotelData.wifiPassword || 'None';

      // Digital Menu Button - Direct Supabase Access
      document.getElementById('menuBtn').addEventListener('click', () => {
        if (hotelData.menuPdfUrl) {
          window.open(hotelData.menuPdfUrl, '_blank');
        } else {
          alert('Digital Menu is not uploaded yet.');
        }
      });

      // Fact Sheet Button - Direct Supabase Access
      document.getElementById('factSheetBtn').addEventListener('click', () => {
        if (hotelData.factSheetUrl) {
          window.open(hotelData.factSheetUrl, '_blank');
        } else {
          alert('Fact Sheet is not uploaded yet.');
        }
      });
    }

    // Submit Request to Telegram API
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.innerText = 'Sending request...';
      statusMsg.style.color = '#2563eb';

      const department = document.getElementById('department').value;
      const items = document.getElementById('requestItems').value;

      try {
        const response = await fetch('/api/requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            hotelId,
            room,
            department,
            items
          })
        });

        const result = await response.json();

        if (result.success) {
          statusMsg.innerText = 'Request sent successfully!';
          statusMsg.style.color = '#16a34a';
          document.getElementById('requestItems').value = '';
        } else {
          statusMsg.innerText = result.message || 'Failed to send request.';
          statusMsg.style.color = '#dc2626';
        }
      } catch (err) {
        statusMsg.innerText = 'Server error. Please try again.';
        statusMsg.style.color = '#dc2626';
      }
    });

    loadHotelDetails();
  </script>
</body>
</html>
