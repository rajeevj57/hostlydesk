<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostlyDesk - Instant Food Menu</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background: #0f172a; color: #fff; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 420px; background: #1e293b; border-radius: 24px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); box-sizing: border-box; }
        .header-top { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 5px; }
        .room-title { font-size: 28px; font-weight: bold; margin: 0 0 15px 0; color: #f8fafc; }
        .search-box { margin-bottom: 15px; }
        .search-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; box-sizing: border-box; outline: none; background: #fdfbf7; color: #1e293b; }
        .card-box { background: #fdfbf7; border-radius: 16px; padding: 15px; color: #1e293b; margin-bottom: 15px; max-height: 400px; overflow-y: auto; }
        .food-item { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .food-info { flex-grow: 1; margin-right: 10px; }
        .food-name { font-size: 14px; font-weight: bold; color: #0f172a; margin-bottom: 3px; }
        .food-desc { font-size: 11px; color: #64748b; margin-bottom: 4px; }
        .food-price { font-size: 12px; font-weight: bold; color: #2563eb; }
        .order-btn { background: #c2a666; color: #fff; border: none; padding: 8px 12px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 12px; text-transform: uppercase; white-space: nowrap; }
        .order-btn:hover { background: #b09355; }
        .alert { padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; font-weight: bold; text-align: center; display: none; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #60a5fa; text-decoration: none; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header-top">HostlyDesk · Room Dining</div>
        <div class="room-title" id="roomDisplay">Room 305</div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search items (e.g., Chicken Tikka)..." oninput="filterItems()">
        </div>

        <div class="card-box">
            <div id="menuList">
                <div style="text-align: center; color: #64748b; padding: 20px;">Loading menu items...</div>
            </div>
        </div>

        <div id="alertBox" class="alert"></div>
        <a id="backPortal" href="/" class="back-link">← Back to Guest Portal</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentRoom = urlParams.get('room') || '305';
        document.getElementById('roomDisplay').textContent = `Room ${currentRoom} Menu`;
        document.getElementById('backPortal').href = `/?room=${currentRoom}`;

        let allMenuItems = [];

        async function fetchMenu() {
            try {
                const res = await fetch('/api/food-items');
                allMenuItems = await res.json();
                renderMenu(allMenuItems);
            } catch (err) {
                document.getElementById('menuList').innerHTML = '<div style="text-align: center; color: #991b1b;">Failed to load menu items.</div>';
            }
        }

        function renderMenu(items) {
            const listEl = document.getElementById('menuList');
            if (!items || items.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">No menu items found.</div>';
                return;
            }

            listEl.innerHTML = '';
            items.forEach(item => {
                listEl.innerHTML += `
                    <div class="food-item">
                        <div class="info-inner" style="flex-grow:1; margin-right:8px;">
                            <div class="food-name">${item.icon || '🍽️'} ${item.name}</div>
                            <div class="food-desc">${item.description || ''}</div>
                            <div class="food-price">₹${item.price || 0}</div>
                        </div>
                        <button class="order-btn" onclick="orderFood('${item.name.replace(/'/g, "\\'")}')">Order</button>
                    </div>
                `;
            });
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMenuItems.filter(item => 
                item.name.toLowerCase().includes(query) || 
                (item.description && item.description.toLowerCase().includes(query)) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderMenu(filtered);
        }

        async function orderFood(itemName) {
            const alertBox = document.getElementById('alertBox');
            try {
                const res = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: currentRoom, department: 'fnb', items: itemName })
                });

                if (res.ok) {
                    alertBox.textContent = `Success! "${itemName}" ordered for Room ${currentRoom}.`;
                    alertBox.style.background = '#d1fae5'; alertBox.style.color = '#065f46'; alertBox.style.display = 'block';
                    setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
                }
            } catch (err) {
                alertBox.textContent = 'Failed to place order. Try again.';
                alertBox.style.background = '#fee2e2'; alertBox.style.color = '#991b1b'; alertBox.style.display = 'block';
            }
        }

        fetchMenu();
    </script>
</body>
</html>
